name: One-shot format OpenSTA probe harness

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.head_ref == 'research/opensta-sdc-probe' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/opensta-sdc-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic source fixes and Ruff formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/opensta_sdc_probe.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              (
                  '    if not isinstance(claims, dict) or any('
                  'claims.get(name) is not True for name in required_claims):\n'
              ): (
                  '    if not isinstance(claims, dict) or any(\n'
                  '        claims.get(name) is not True '
                  'for name in required_claims\n'
                  '    ):\n'
              ),
              (
                  '    if not isinstance(prepared, dict) or '
                  'prepared.get("schema") != '
                  '"hephaestus.opensta-sdc-prepared.v1":\n'
              ): (
                  '    if (\n'
                  '        not isinstance(prepared, dict)\n'
                  '        or prepared.get("schema")\n'
                  '        != "hephaestus.opensta-sdc-prepared.v1"\n'
                  '    ):\n'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected source fragment not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install 'ruff==0.16.3'
          ruff format scripts/opensta_sdc_probe.py
          ruff check scripts/opensta_sdc_probe.py
          ruff format --check scripts/opensta_sdc_probe.py
      - name: Commit only the formatted harness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/opensta_sdc_probe.py
          git commit -m 'Format the OpenSTA SDC probe harness'
          git push origin HEAD:research/opensta-sdc-probe
