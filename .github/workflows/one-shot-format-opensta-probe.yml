name: One-shot format OpenSTA probe harness

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.head_ref == 'research/opensta-sdc-probe' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/opensta-sdc-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Ruff formatting
        run: |
          python -m pip install 'ruff==0.16.3'
          ruff check --fix scripts/opensta_sdc_probe.py
          ruff format scripts/opensta_sdc_probe.py
          ruff check scripts/opensta_sdc_probe.py
          ruff format --check scripts/opensta_sdc_probe.py
      - name: Commit only the formatted harness
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/opensta_sdc_probe.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'Format the OpenSTA SDC probe harness'
          git push origin HEAD:research/opensta-sdc-probe
