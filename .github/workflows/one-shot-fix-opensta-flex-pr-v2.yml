name: One-shot position-aware OpenSTA Flex fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.head_ref == 'research/opensta-sdc-probe' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/opensta-sdc-probe
      - name: Patch the OpenSTA CMake block by position
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/opensta-sdc-probe.yml')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          slash = chr(92)

          flex_argument = '            -DFLEX_INCLUDE_DIR=/usr/include ' + slash + '\n'
          if flex_argument not in lines:
              cudd_argument = (
                  '            -DCUDD_DIR="$root/cudd-3.0.0" ' + slash + '\n'
              )
              try:
                  cudd_index = lines.index(cudd_argument)
              except ValueError as exc:
                  raise SystemExit('CUDD CMake argument not found') from exc
              lines.insert(cudd_index + 1, flex_argument)

          flex_check = '          test -f /usr/include/FlexLexer.h\n'
          if flex_check not in lines:
              start = next(
                  index
                  for index, line in enumerate(lines)
                  if 'rev-parse HEAD' in line
              )
              cmake_index = next(
                  index
                  for index in range(start + 1, len(lines))
                  if lines[index].rstrip('\n') == '          cmake ' + slash
              )
              lines[cmake_index:cmake_index] = [
                  flex_check,
                  '          sha256sum /usr/include/FlexLexer.h ' + slash + '\n',
                  '            | tee "$root/flex-header.sha256.txt"\n',
                  '\n',
              ]

          path.write_text(''.join(lines), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/opensta-sdc-probe.yml
          if git diff --cached --quiet; then
            echo 'The OpenSTA workflow was already patched.'
            exit 0
          fi
          git commit -m 'Pin the OpenSTA Flex include directory'
          git push origin HEAD:research/opensta-sdc-probe
