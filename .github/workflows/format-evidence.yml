name: Temporary evidence formatting

on:
  push:
    branches:
      - feat/evidence-benchmarks

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evidence-benchmarks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.3'
      - name: Apply deterministic formatting fixes
        run: |
          ruff check --fix . || true
          python - <<'PY'
          from pathlib import Path

          path = Path('src/hephaestus/benchmark.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '    compiled_adders = int(compiled_value) if compiled_value is not None else _count_adder_nodes(plan)\n': (
                  '    compiled_adders = (\n'
                  '        int(compiled_value)\n'
                  '        if compiled_value is not None\n'
                  '        else _count_adder_nodes(plan)\n'
                  '    )\n'
              ),
              '    artifacts = {label: path.relative_to(output_root).as_posix() for label, path in required.items()}\n': (
                  '    artifacts = {\n'
                  '        label: path.relative_to(output_root).as_posix()\n'
                  '        for label, path in required.items()\n'
                  '    }\n'
              ),
              '        "This report contains compiler and RTL-level evidence only. It does not claim post-synthesis ",\n': (
                  '        "This report contains compiler and RTL-level evidence only.",\n'
                  '        "It does not claim post-synthesis PPA, post-layout extraction, or measured silicon.",\n'
              ),
              '        "PPA, post-layout extraction, or measured silicon.",\n': '',
              '        "| Case | Shape | Nonzero | Naive adders | Compiled adders | Saved | Max depth | Max fanout | Runtime weight reads | Bit-exact |",\n': (
                  '        (\n'
                  '            "| Case | Shape | Nonzero | Naive adders | Compiled adders | Saved | "\n'
                  '            "Max depth | Max fanout | Runtime weight reads | Bit-exact |"\n'
                  '        ),\n'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected source fragment was not found: {old!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          ruff format .
          ruff check .
          rm .github/workflows/format-evidence.yml
      - name: Commit formatted evidence code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format the structural evidence runner'
          git push origin HEAD:feat/evidence-benchmarks
