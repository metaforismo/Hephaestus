name: Temporary formal formatting

on:
  push:
    branches:
      - feat/formal-equivalence-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/formal-equivalence-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.3'
      - name: Apply deterministic Ruff fixes
        run: |
          ruff check --fix src/hephaestus/formal.py tests/test_formal.py
          ruff format src/hephaestus/formal.py tests/test_formal.py
          ruff check src/hephaestus/formal.py tests/test_formal.py
      - name: Commit formatted code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hephaestus/formal.py tests/test_formal.py
          git commit -m 'Format formal equivalence implementation'
          git push origin HEAD:feat/formal-equivalence-evidence
