name: One-shot format post-physical probe

on:
  push:
    branches:
      - research/openroad-post-physical-equivalence-probe

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/openroad-post-physical-equivalence-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply the repository formatter and remove staging payloads
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff check --fix \
            flows/openroad/post_physical_equivalence/run_probe.py \
            tests/test_post_physical_probe.py
          ruff format \
            flows/openroad/post_physical_equivalence/run_probe.py \
            tests/test_post_physical_probe.py
          rm -rf .github/post-physical-payload
          rm .github/workflows/format-post-physical-probe.yml
          ruff check \
            flows/openroad/post_physical_equivalence/run_probe.py \
            tests/test_post_physical_probe.py
          ruff format --check \
            flows/openroad/post_physical_equivalence/run_probe.py \
            tests/test_post_physical_probe.py
          pytest tests/test_post_physical_probe.py
      - name: Commit the clean research source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format and clean the post-physical probe'
          git push origin HEAD:research/openroad-post-physical-equivalence-probe
