name: Research OpenROAD registered-tile smoke

on:
  push:
    branches:
      - research/openroad-registered-smoke
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared-dag-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned RTL and proof tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            'iverilog=12.0-2build2' \
            'yosys=0.33-5build2' \
            'yosys-abc=0.33-5build2'

      - name: Install Hephaestus
        run: python -m pip install -e '.[dev]'

      - name: Rebuild and prove the registered source bundle
        run: |
          set -euo pipefail
          python -m hephaestus compile examples/tiny_weights.json \
            --out build/openroad-smoke/source \
            --module hephaestus_registered_source \
            --verify-samples 256
          python -m hephaestus.baselines build/openroad-smoke/source \
            --out build/openroad-smoke/matched \
            --module hephaestus_registered \
            --verify-vectors 256 \
            --seed 59 \
            --simulate
          python -m hephaestus.formal build/openroad-smoke/matched \
            --codes build/openroad-smoke/source/codes.npy \
            --out build/openroad-smoke/formal \
            --max-input-bits 64 \
            --timeout 300
          python -m hephaestus.registered build/openroad-smoke/matched \
            --codes build/openroad-smoke/source/codes.npy \
            --formal-evidence build/openroad-smoke/formal/formal_evidence.json \
            --out build/openroad-smoke/registered \
            --module hephaestus_registered_tile \
            --verify-vectors 256 \
            --seed 59 \
            --simulate

      - name: Validate the registered source binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('build/openroad-smoke/registered')
          evidence = json.loads(
              (root / 'registered_manifest.json').read_text(encoding='utf-8')
          )
          reference = json.loads(
              Path(
                  'benchmarks/reference/registered_matched_tiles_tiny_v1.json'
              ).read_text(encoding='utf-8')
          )
          assert evidence['schema'] == 'hephaestus.registered-matched-tiles.v1'
          assert evidence['contract'] == reference['contract']
          assert evidence['claims'] == reference['claim_boundary']
          shared = evidence['backends']['shared_dag']
          assert shared['core_rtl'] == 'shared_dag_core.sv'
          assert shared['wrapper_rtl'] == 'shared_dag_registered.sv'
          assert shared['core_sha256'] == (
              reference['source_artifacts']['core_sha256']['shared_dag']
          )
          assert shared['wrapper_sha256'] == (
              reference['generated_artifacts']['wrapper_sha256']['shared_dag']
          )
          PY

      - name: Pull and capture the official ORFS image
        run: |
          set -euo pipefail
          mkdir -p build/openroad-smoke/provenance
          docker pull openroad/orfs:latest
          docker image inspect openroad/orfs:latest \
            > build/openroad-smoke/provenance/orfs-image-inspect.json
          docker image inspect \
            --format '{{json .RepoDigests}}' \
            openroad/orfs:latest \
            > build/openroad-smoke/provenance/orfs-image-repodigests.json
          docker image inspect \
            --format '{{.Id}}' \
            openroad/orfs:latest \
            > build/openroad-smoke/provenance/orfs-image-id.txt
          docker run --rm openroad/orfs:latest bash -lc '
            set -e
            source /OpenROAD-flow-scripts/env.sh
            printf "orfs_commit="
            git -C /OpenROAD-flow-scripts rev-parse HEAD 2>/dev/null || printf "unavailable\n"
            openroad -version
            yosys -V
            klayout -v
          ' > build/openroad-smoke/provenance/tool-versions.txt 2>&1

      - name: Run the registered shared DAG through RTL-to-GDS
        id: orfs
        run: |
          set -uo pipefail
          mkdir -p \
            build/openroad-smoke/results \
            build/openroad-smoke/reports \
            build/openroad-smoke/logs \
            build/openroad-smoke/objects

          docker run --rm \
            -e HEPHAESTUS_REGISTERED_DIR=/work/registered \
            -v "$PWD/build/openroad-smoke/registered:/work/registered:ro" \
            -v "$PWD/flows/openroad/registered_shared_dag:/work/design:ro" \
            -v "$PWD/build/openroad-smoke/results:/OpenROAD-flow-scripts/flow/results" \
            -v "$PWD/build/openroad-smoke/reports:/OpenROAD-flow-scripts/flow/reports" \
            -v "$PWD/build/openroad-smoke/logs:/OpenROAD-flow-scripts/flow/logs" \
            -v "$PWD/build/openroad-smoke/objects:/OpenROAD-flow-scripts/flow/objects" \
            openroad/orfs:latest bash -lc '
              set -euo pipefail
              source /OpenROAD-flow-scripts/env.sh
              cd /OpenROAD-flow-scripts/flow
              make \
                DESIGN_CONFIG=/work/design/config.mk \
                FLOW_VARIANT=smoke
            ' \
            > build/openroad-smoke/orfs.stdout.txt \
            2> build/openroad-smoke/orfs.stderr.txt
          returncode=$?
          printf '%s\n' "$returncode" \
            > build/openroad-smoke/orfs.returncode.txt
          printf 'returncode=%s\n' "$returncode" >> "$GITHUB_OUTPUT"
          sudo chown -R "$(id -u):$(id -g)" build/openroad-smoke || true
          exit 0

      - name: Preserve synthesized-netlist diagnostics
        if: always()
        run: |
          set -euo pipefail
          diagnostics=build/openroad-smoke/diagnostics
          mkdir -p "$diagnostics"

          find build/openroad-smoke \
            -maxdepth 8 \
            -type f \
            -printf '%p\t%s bytes\n' \
            | sort \
            > "$diagnostics/file-inventory.tsv"

          mapfile -t netlists < <(
            find build/openroad-smoke/results \
              -type f \
              -name '1_2_yosys.v' \
              | sort
          )
          printf '%s\n' "${netlists[@]:-}" \
            > "$diagnostics/synthesized-netlist-paths.txt"

          if [ "${#netlists[@]}" -eq 1 ]; then
            netlist=${netlists[0]}
            cp "$netlist" "$diagnostics/1_2_yosys.v"
            sha256sum "$netlist" \
              | tee "$diagnostics/1_2_yosys.sha256"
            file "$netlist" \
              | tee "$diagnostics/1_2_yosys.file.txt"
            nl -ba "$netlist" \
              | sed -n '1,100p' \
              | tee "$diagnostics/1_2_yosys.lines-1-100.txt"

            NETLIST="$netlist" python - <<'PY' \
              | tee "$diagnostics/1_2_yosys.line-bytes.txt"
          import os
          from pathlib import Path

          path = Path(os.environ['NETLIST'])
          raw = path.read_bytes()
          lines = raw.splitlines(keepends=True)
          print(f'path={path}')
          print(f'bytes={len(raw)}')
          print(f'line_count={len(lines)}')
          for number in range(1, min(len(lines), 40) + 1):
              value = lines[number - 1]
              print(f'{number:04d}: repr={value!r}')
              if number == 17:
                  print(f'0017-hex={value.hex()}')
          PY

            set +e
            iverilog -g2012 -tnull -i "$netlist" \
              > "$diagnostics/iverilog.stdout.txt" \
              2> "$diagnostics/iverilog.stderr.txt"
            printf '%s\n' "$?" \
              > "$diagnostics/iverilog.returncode.txt"
            yosys -Q -p "read_verilog -sv $netlist" \
              > "$diagnostics/yosys-read.stdout.txt" \
              2> "$diagnostics/yosys-read.stderr.txt"
            printf '%s\n' "$?" \
              > "$diagnostics/yosys-read.returncode.txt"
            set -e
          else
            printf 'expected one synthesized netlist, found %s\n' \
              "${#netlists[@]}" \
              | tee "$diagnostics/netlist-count-error.txt"
          fi

          tail -n 300 build/openroad-smoke/orfs.stdout.txt \
            > "$diagnostics/orfs.stdout.tail.txt" || true
          tail -n 300 build/openroad-smoke/orfs.stderr.txt \
            > "$diagnostics/orfs.stderr.tail.txt" || true

      - name: Build a fail-closed smoke manifest
        if: steps.orfs.outputs.returncode == '0'
        env:
          GITHUB_HEAD_SHA: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('build/openroad-smoke')
          registered = root / 'registered'
          registered_manifest_path = registered / 'registered_manifest.json'
          registered_manifest = json.loads(
              registered_manifest_path.read_text(encoding='utf-8')
          )
          shared = registered_manifest['backends']['shared_dag']

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def exactly_one(pattern: str) -> Path:
              matches = sorted(root.glob(pattern))
              if len(matches) != 1:
                  raise SystemExit(
                      f'expected exactly one {pattern!r}, found {len(matches)}: {matches}'
                  )
              return matches[0]

          required = {
              'final_gds': exactly_one('results/**/smoke/6_final.gds'),
              'final_def': exactly_one('results/**/smoke/6_final.def'),
              'final_verilog': exactly_one('results/**/smoke/6_final.v'),
              'final_odb': exactly_one('results/**/smoke/6_final.odb'),
          }
          spef_matches = sorted(root.glob('results/**/smoke/6_final.spef'))
          if len(spef_matches) > 1:
              raise SystemExit(f'ambiguous final SPEF set: {spef_matches}')
          if spef_matches:
              required['final_spef'] = spef_matches[0]

          for label, path in required.items():
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'{label} is missing or empty: {path}')

          repo_digests = json.loads(
              (root / 'provenance/orfs-image-repodigests.json').read_text(
                  encoding='utf-8'
              )
          )
          if not isinstance(repo_digests, list) or len(repo_digests) != 1:
              raise SystemExit(f'expected one ORFS image RepoDigest, got {repo_digests!r}')

          config_path = Path('flows/openroad/registered_shared_dag/config.mk')
          sdc_path = Path('flows/openroad/registered_shared_dag/constraint.sdc')
          manifest = {
              'schema': 'hephaestus.openroad-registered-smoke.v1',
              'evidence_level': 'research_single_backend_rtl_to_gds_smoke',
              'source': {
                  'github_head_sha': os.environ['GITHUB_HEAD_SHA'],
                  'github_run_id': int(os.environ['GITHUB_RUN_ID_VALUE']),
                  'registered_manifest': registered_manifest_path.relative_to(root).as_posix(),
                  'registered_manifest_sha256': sha256(registered_manifest_path),
                  'core_rtl': shared['core_rtl'],
                  'core_sha256': sha256(registered / shared['core_rtl']),
                  'wrapper_rtl': shared['wrapper_rtl'],
                  'wrapper_sha256': sha256(registered / shared['wrapper_rtl']),
              },
              'toolchain': {
                  'orfs_image': 'openroad/orfs:latest',
                  'orfs_image_repo_digest': repo_digests[0],
                  'orfs_image_id': (
                      root / 'provenance/orfs-image-id.txt'
                  ).read_text(encoding='utf-8').strip(),
                  'tool_versions': 'provenance/tool-versions.txt',
                  'tool_versions_sha256': sha256(
                      root / 'provenance/tool-versions.txt'
                  ),
              },
              'physical_contract': {
                  'platform': 'ihp-sg13g2',
                  'backend': 'shared_dag',
                  'mapping_label': 'registered_source_core',
                  'clock_port': 'clk',
                  'clock_period_ns': 4.0,
                  'die_area_um': [0.0, 0.0, 240.0, 240.0],
                  'core_area_um': [20.0, 20.0, 220.0, 220.0],
                  'place_density': 0.50,
                  'min_routing_layer': 'Metal2',
                  'max_routing_layer': 'Metal5',
                  'config': config_path.as_posix(),
                  'config_sha256': sha256(config_path),
                  'sdc': sdc_path.as_posix(),
                  'sdc_sha256': sha256(sdc_path),
              },
              'artifacts': {
                  label: {
                      'path': path.relative_to(root).as_posix(),
                      'size_bytes': path.stat().st_size,
                      'sha256': sha256(path),
                  }
                  for label, path in required.items()
              },
              'execution': {
                  'returncode': int(
                      (root / 'orfs.returncode.txt')
                      .read_text(encoding='utf-8')
                      .strip()
                  ),
                  'stdout': 'orfs.stdout.txt',
                  'stdout_sha256': sha256(root / 'orfs.stdout.txt'),
                  'stderr': 'orfs.stderr.txt',
                  'stderr_sha256': sha256(root / 'orfs.stderr.txt'),
              },
              'claims': {
                  'registered_source_binding_verified': True,
                  'single_backend_orfs_flow_completed': True,
                  'placement_performed': True,
                  'routing_performed': True,
                  'gds_generated': True,
                  'spef_generated': 'final_spef' in required,
                  'matched_three_backend_physical_comparison_performed': False,
                  'post_physical_equivalence_verified': False,
                  'drc_clean': False,
                  'lvs_clean': False,
                  'power_estimated_with_activity': False,
                  'post_layout_pex_verified': False,
                  'foundry_signoff_complete': False,
                  'silicon_verified': False,
              },
          }
          if manifest['execution']['returncode'] != 0:
              raise SystemExit('ORFS return code is nonzero')
          if manifest['source']['core_sha256'] != shared['core_sha256']:
              raise SystemExit('registered core digest drifted before physical flow')
          if manifest['source']['wrapper_sha256'] != shared['wrapper_sha256']:
              raise SystemExit('registered wrapper digest drifted before physical flow')

          path = root / 'openroad_smoke_manifest.json'
          path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload the complete research smoke bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-openroad-registered-shared-dag-smoke
          path: build/openroad-smoke
          if-no-files-found: error
          retention-days: 30

      - name: Fail when the ORFS flow did not complete
        if: always()
        env:
          ORFS_RETURNCODE: ${{ steps.orfs.outputs.returncode }}
        run: |
          set -euo pipefail
          if [ "${ORFS_RETURNCODE:-missing}" != '0' ]; then
            echo "ORFS did not complete: return code ${ORFS_RETURNCODE:-missing}"
            exit 1
          fi
