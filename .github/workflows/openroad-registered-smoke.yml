name: Research OpenROAD registered-tile smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  ORFS_IMAGE: openroad/orfs@sha256:73bd87efa06758865277f347fbc6b932642d8ab21a5430c5ce5480aaa60c27d0

jobs:
  shared-dag-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'research/openroad-registered-smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned RTL and proof tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            'iverilog=12.0-2build2' \
            'yosys=0.33-5build2' \
            'yosys-abc=0.33-5build2'

      - name: Install Hephaestus
        run: python -m pip install -e '.[dev]'

      - name: Test the physical compatibility and reference validators
        run: |
          ruff check \
            flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          ruff format --check \
            flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          python flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            --self-test
          python flows/openroad/registered_shared_dag/validate_smoke_reference.py \
            --self-test

      - name: Rebuild and prove the registered source bundle
        run: |
          set -euo pipefail
          python -m hephaestus compile examples/tiny_weights.json \
            --out build/openroad-smoke/source \
            --module hephaestus_registered_source \
            --verify-samples 256
          python -m hephaestus.baselines build/openroad-smoke/source \
            --out build/openroad-smoke/matched \
            --module hephaestus_registered \
            --verify-vectors 256 \
            --seed 59 \
            --simulate
          python -m hephaestus.formal build/openroad-smoke/matched \
            --codes build/openroad-smoke/source/codes.npy \
            --out build/openroad-smoke/formal \
            --max-input-bits 64 \
            --timeout 300
          python -m hephaestus.registered build/openroad-smoke/matched \
            --codes build/openroad-smoke/source/codes.npy \
            --formal-evidence build/openroad-smoke/formal/formal_evidence.json \
            --out build/openroad-smoke/registered \
            --module hephaestus_registered_tile \
            --verify-vectors 256 \
            --seed 59 \
            --simulate

      - name: Validate the registered source binding
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('build/openroad-smoke/registered')
          evidence = json.loads(
              (root / 'registered_manifest.json').read_text(encoding='utf-8')
          )
          reference = json.loads(
              Path(
                  'benchmarks/reference/registered_matched_tiles_tiny_v1.json'
              ).read_text(encoding='utf-8')
          )
          assert evidence['schema'] == 'hephaestus.registered-matched-tiles.v1'
          assert evidence['contract'] == reference['contract']
          assert evidence['claims'] == reference['claim_boundary']
          shared = evidence['backends']['shared_dag']
          assert shared['core_rtl'] == 'shared_dag_core.sv'
          assert shared['wrapper_rtl'] == 'shared_dag_registered.sv'
          assert shared['core_sha256'] == (
              reference['source_artifacts']['core_sha256']['shared_dag']
          )
          assert shared['wrapper_sha256'] == (
              reference['generated_artifacts']['wrapper_sha256']['shared_dag']
          )
          PY

      - name: Pull and capture the pinned ORFS image
        run: |
          set -euo pipefail
          mkdir -p build/openroad-smoke/provenance
          docker pull "$ORFS_IMAGE"
          docker image inspect "$ORFS_IMAGE" \
            > build/openroad-smoke/provenance/orfs-image-inspect.json
          docker image inspect \
            --format '{{json .RepoDigests}}' \
            "$ORFS_IMAGE" \
            > build/openroad-smoke/provenance/orfs-image-repodigests.json
          docker image inspect \
            --format '{{.Id}}' \
            "$ORFS_IMAGE" \
            > build/openroad-smoke/provenance/orfs-image-id.txt
          docker run --rm "$ORFS_IMAGE" bash -lc '
            set -e
            source /OpenROAD-flow-scripts/env.sh
            printf "orfs_commit="
            git -C /OpenROAD-flow-scripts rev-parse HEAD 2>/dev/null || printf "unavailable\n"
            openroad -version
            yosys -V
            klayout -v
          ' > build/openroad-smoke/provenance/tool-versions.txt 2>&1

      - name: Run the registered shared DAG through RTL-to-GDS
        id: orfs
        run: |
          set -uo pipefail
          mkdir -p \
            build/openroad-smoke/results \
            build/openroad-smoke/reports \
            build/openroad-smoke/logs \
            build/openroad-smoke/objects

          set +e
          docker run --rm \
            -e HEPHAESTUS_REGISTERED_DIR=/work/registered \
            -v "$PWD/build/openroad-smoke/registered:/work/registered:ro" \
            -v "$PWD/flows/openroad/registered_shared_dag:/work/design:ro" \
            -v "$PWD/build/openroad-smoke/results:/OpenROAD-flow-scripts/flow/results" \
            -v "$PWD/build/openroad-smoke/reports:/OpenROAD-flow-scripts/flow/reports" \
            -v "$PWD/build/openroad-smoke/logs:/OpenROAD-flow-scripts/flow/logs" \
            -v "$PWD/build/openroad-smoke/objects:/OpenROAD-flow-scripts/flow/objects" \
            "$ORFS_IMAGE" bash -lc '
              set -euo pipefail
              source /OpenROAD-flow-scripts/env.sh
              cd /OpenROAD-flow-scripts/flow
              make \
                DESIGN_CONFIG=/work/design/config.mk \
                FLOW_VARIANT=smoke
            ' \
            > build/openroad-smoke/orfs.stdout.txt \
            2> build/openroad-smoke/orfs.stderr.txt
          returncode=$?
          set -e

          sudo chown -R "$(id -u):$(id -g)" build/openroad-smoke || true
          sudo chmod -R u+rwX,go+rX build/openroad-smoke || true
          printf '%s\n' "$returncode" \
            > build/openroad-smoke/orfs.returncode.txt
          printf 'returncode=%s\n' "$returncode" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preserve focused physical diagnostics
        if: always()
        run: |
          set -euo pipefail
          diagnostics=build/openroad-smoke/diagnostics
          mkdir -p "$diagnostics"

          find build/openroad-smoke \
            -maxdepth 8 \
            -type f \
            -printf '%p\t%s bytes\n' \
            | sort \
            > "$diagnostics/file-inventory.tsv"

          for pattern in \
            '1_2_yosys.v' \
            '1_2_yosys.v.pre-opensta-compat' \
            '1_2_yosys.opensta_compat.json' \
            '6_final.gds' \
            '6_final.def' \
            '6_final.odb' \
            '6_final.v' \
            '6_final.spef' \
            '6_final.sdc' \
            'route.guide' \
            '6_report.json'; do
            find build/openroad-smoke -type f -name "$pattern" -print \
              >> "$diagnostics/selected-artifact-paths.txt" || true
          done

          tail -n 300 build/openroad-smoke/orfs.stdout.txt \
            > "$diagnostics/orfs.stdout.tail.txt" || true
          tail -n 300 build/openroad-smoke/orfs.stderr.txt \
            > "$diagnostics/orfs.stderr.tail.txt" || true

      - name: Validate the exact pinned smoke reference
        if: steps.orfs.outputs.returncode == '0'
        run: |
          python flows/openroad/registered_shared_dag/validate_smoke_reference.py \
            --root build/openroad-smoke \
            --reference \
              benchmarks/reference/ihp_sg13g2_openroad_registered_shared_dag_smoke_v1.json \
            --registered build/openroad-smoke/registered \
            --image-ref "$ORFS_IMAGE" \
            --out build/openroad-smoke/openroad_smoke_validation.json

      - name: Upload the complete qualified smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-openroad-registered-shared-dag-smoke-evidence
          path: build/openroad-smoke
          if-no-files-found: error
          retention-days: 30

      - name: Fail when the ORFS flow did not complete
        if: always()
        env:
          ORFS_RETURNCODE: ${{ steps.orfs.outputs.returncode }}
        run: |
          set -euo pipefail
          if [ "${ORFS_RETURNCODE:-missing}" != '0' ]; then
            echo "ORFS did not complete: return code ${ORFS_RETURNCODE:-missing}"
            exit 1
          fi
