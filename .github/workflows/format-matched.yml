name: Temporary matched formatting

on:
  push:
    branches:
      - feat/matched-backend-baselines

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/matched-backend-baselines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.3'
      - name: Apply Ruff fixes
        run: |
          ruff check --fix src/hephaestus/baselines.py tests/test_baselines.py
          ruff format src/hephaestus/baselines.py tests/test_baselines.py
          ruff check src/hephaestus/baselines.py tests/test_baselines.py
          rm .github/workflows/format-matched.yml
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format the matched backend implementation'
          git push origin HEAD:feat/matched-backend-baselines
