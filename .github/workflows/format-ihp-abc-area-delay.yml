name: One-shot IHP ABC area-delay formatting

on:
  push:
    branches:
      - feat/ihp-abc-area-delay-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ihp-abc-area-delay-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the CI Ruff version
        run: python -m pip install 'ruff==0.16.3'
      - name: Format and verify the implementation
        run: |
          set -euo pipefail
          ruff check --fix src/hephaestus/abc_timing.py tests/test_abc_timing.py
          ruff format src/hephaestus/abc_timing.py tests/test_abc_timing.py
          ruff check src/hephaestus/abc_timing.py tests/test_abc_timing.py
          ruff format --check src/hephaestus/abc_timing.py tests/test_abc_timing.py
      - name: Commit formatted files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hephaestus/abc_timing.py tests/test_abc_timing.py
          git diff --cached --check
          git commit -m 'Format IHP ABC area-delay evidence code'
          git push origin HEAD:feat/ihp-abc-area-delay-evidence
