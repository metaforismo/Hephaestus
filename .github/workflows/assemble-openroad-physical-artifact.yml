name: One-shot materialize OpenROAD physical source

on:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.head_ref == 'feat/openroad-physical-evidence' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openroad-physical-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Decode the hardened implementation payload
        run: |
          set -euo pipefail
          mkdir -p src/hephaestus tests
          cat \
            .github/openroad-materialize/src_00.b64 \
            .github/openroad-materialize/src_01.b64 \
            .github/openroad-materialize/src_02.b64 \
            .github/openroad-materialize/src_03_0.b64 \
            .github/openroad-materialize/src_03_1_0.b64 \
            .github/openroad-materialize/src_03_1_1.b64 \
            .github/openroad-materialize/src_03_2.b64 \
            .github/openroad-materialize/src_04.b64 \
            .github/openroad-materialize/src_05.b64 \
            .github/openroad-materialize/src_06.b64 \
            | base64 --decode \
            | gzip --decompress \
            > src/hephaestus/openroad_physical.py
          cat .github/openroad-materialize/test_*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > tests/test_openroad_physical.py
          printf '%s  %s\n' \
            d57dc89f919a2e02501198d0152fa1c62eaf873de755b525a2591ef399a7126e \
            src/hephaestus/openroad_physical.py \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            d9833aaf308e1c1e9dc763b027c145e9f0821fe174e73c0b07b41b3eb2a49ccc \
            tests/test_openroad_physical.py \
            | sha256sum --check --strict

      - name: Import the qualified shared-DAG smoke boundary
        run: |
          set -euo pipefail
          git fetch origin research/openroad-registered-smoke
          mkdir -p benchmarks/reference flows/openroad/registered_shared_dag
          for path in \
            benchmarks/reference/ihp_sg13g2_openroad_registered_shared_dag_smoke_v1.json \
            flows/openroad/registered_shared_dag/PROBE_RESULT.md \
            flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            flows/openroad/registered_shared_dag/synth_compat.tcl \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py; do
            git show "origin/research/openroad-registered-smoke:$path" > "$path"
          done
          chmod +x flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py

      - name: Install, format, and verify the permanent source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/hephaestus/openroad_physical.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [
              index
              for index, line in enumerate(lines)
              if 'It does not prove post-physical functional equivalence' in line
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f'expected one claim-boundary prose block, found {len(matches)}'
              )
          index = matches[0]
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines[index : index + 3] = [
              indent
              + '"It does not prove post-physical equivalence, DRC, LVS, or activity-based power.",',
              indent
              + '"It also does not prove validated PEX, foundry sign-off, or fabricated silicon.",',
              indent
              + '"Comparative PPA stays disabled until routed-netlist equivalence is proved.",',
          ]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m pip install -e '.[dev]'
          ruff format \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py \
            flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          ruff check --fix \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py \
            flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          ruff format \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py \
            flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          ruff check \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py \
            flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          ruff format --check \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py \
            flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          pytest tests/test_openroad_physical.py
          python -m hephaestus.openroad_physical --help
          python flows/openroad/registered_shared_dag/sanitize_yosys_netlist.py \
            --self-test
          python flows/openroad/registered_shared_dag/validate_smoke_reference.py \
            --self-test

      - name: Remove fragment and payload staging directories
        run: |
          set -euo pipefail
          rm -rf \
            .github/openroad-materialize \
            .github/openroad-physical-parts \
            .github/openroad-physical-payload

      - name: Commit the permanent non-workflow source tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py \
            configs/physical/ihp_sg13g2_openroad_registered_v1.json \
            benchmarks/reference/ihp_sg13g2_openroad_registered_shared_dag_smoke_v1.json \
            flows/openroad/registered_shared_dag \
            .github/openroad-materialize \
            .github/openroad-physical-parts \
            .github/openroad-physical-payload
          git commit -m 'Materialize matched OpenROAD physical evidence source'
          git push origin HEAD:feat/openroad-physical-evidence
