name: One-shot format PVT corner probe

on:
  push:
    branches:
      - research/ihp-pvt-corner-probe

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ihp-pvt-corner-probe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Format and verify the new research files
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff check --fix \
            flows/openroad/pvt_corner/run_probe.py \
            tests/test_pvt_corner_probe.py
          ruff format \
            flows/openroad/pvt_corner/run_probe.py \
            tests/test_pvt_corner_probe.py
          ruff check \
            flows/openroad/pvt_corner/run_probe.py \
            tests/test_pvt_corner_probe.py
          ruff format --check \
            flows/openroad/pvt_corner/run_probe.py \
            tests/test_pvt_corner_probe.py
          pytest tests/test_pvt_corner_probe.py
          python flows/openroad/pvt_corner/run_probe.py --help
      - name: Commit formatting changes when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            flows/openroad/pvt_corner/run_probe.py \
            tests/test_pvt_corner_probe.py; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            flows/openroad/pvt_corner/run_probe.py \
            tests/test_pvt_corner_probe.py
          git commit -m 'Format and verify the PVT corner probe'
          git push origin HEAD:research/ihp-pvt-corner-probe
