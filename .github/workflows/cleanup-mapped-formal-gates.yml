name: One-shot mapped formal workflow cleanup

on:
  push:
    branches:
      - feat/ihp-mapped-formal-evidence

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ihp-mapped-formal-evidence
          fetch-depth: 0
      - name: Remove superseded one-shot workflows
        run: |
          git rm --ignore-unmatch \
            .github/workflows/cleanup-mapped-formal-gates.yml \
            .github/workflows/one-shot-merge-mapped-formal.yml \
            .github/workflows/one-shot-merge-mapped-formal-v2.yml \
            .github/workflows/fix-mapped-formal-liberty-path.yml \
            .github/workflows/fix-mapped-formal-liberty-path-v2.yml \
            .github/workflows/format-mapped-formal.yml \
            .github/workflows/format-mapped-formal-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove superseded mapped formal one-shot workflows'
          git push origin HEAD:feat/ihp-mapped-formal-evidence
