name: Temporary synthesis formatting

on:
  push:
    branches:
      - feat/generic-yosys-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/generic-yosys-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.3'
      - name: Format synthesis evidence code
        run: |
          ruff check --fix src/hephaestus/synthesis.py tests/test_synthesis.py
          ruff format src/hephaestus/synthesis.py tests/test_synthesis.py
          ruff check src/hephaestus/synthesis.py tests/test_synthesis.py
          rm .github/workflows/format-synthesis.yml
      - name: Commit formatted code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format generic synthesis evidence code'
          git push origin HEAD:feat/generic-yosys-evidence
