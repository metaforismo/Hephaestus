name: One-shot enable OpenSTA PR visibility

on:
  push:
    branches:
      - research/opensta-sdc-probe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/opensta-sdc-probe
      - name: Add pull-request trigger
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/opensta-sdc-probe.yml')
          text = path.read_text(encoding='utf-8')
          needle = '  workflow_dispatch:\n'
          replacement = '  pull_request:\n  workflow_dispatch:\n'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('workflow_dispatch trigger not found')
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/opensta-sdc-probe.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Run the OpenSTA probe on pull requests'
          git push origin HEAD:research/opensta-sdc-probe
