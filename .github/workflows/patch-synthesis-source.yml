name: Temporary self-contained synthesis patch

on:
  push:
    branches:
      - feat/generic-yosys-evidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/generic-yosys-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve the matched source manifest inside the evidence bundle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/hephaestus/synthesis.py')
          text = path.read_text(encoding='utf-8')
          old_load = (
              '    matched_manifest = _load_json(matched_manifest_path)\n'
              '    if matched_manifest.get("schema") != "hephaestus.matched-baselines.v1":\n'
          )
          new_load = (
              '    matched_manifest = _load_json(matched_manifest_path)\n'
              '    preserved_manifest = output / "source_matched_manifest.json"\n'
              '    shutil.copyfile(matched_manifest_path, preserved_manifest)\n'
              '    if matched_manifest.get("schema") != "hephaestus.matched-baselines.v1":\n'
          )
          old_source = (
              '        "source": {\n'
              '            "matched_manifest": str(matched_manifest_path),\n'
              '            "matched_manifest_sha256": sha256_file(matched_manifest_path),\n'
              '        },\n'
          )
          new_source = (
              '        "source": {\n'
              '            "matched_manifest": preserved_manifest.name,\n'
              '            "matched_manifest_sha256": sha256_file(preserved_manifest),\n'
              '        },\n'
          )
          if old_load not in text or old_source not in text:
              raise SystemExit('expected synthesis source fragments were not found')
          path.write_text(
              text.replace(old_load, new_load).replace(old_source, new_source),
              encoding='utf-8',
          )
          PY
          python -m pip install 'ruff==0.16.3'
          ruff format src/hephaestus/synthesis.py
          ruff check src/hephaestus/synthesis.py
      - name: Commit the source-only portability patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hephaestus/synthesis.py
          git commit -m 'Make generic synthesis evidence self-contained'
          git push origin HEAD:feat/generic-yosys-evidence
