name: Format SPEF evidence branch

on:
  push:
    branches:
      - feat/spef-semantic-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spef-semantic-evidence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the repository formatter
        run: |
          python -m pip install 'ruff==0.16.4'
          ruff format \
            src/hephaestus/spef_semantic/_builder.py \
            src/hephaestus/spef_semantic/_common.py \
            src/hephaestus/spef_semantic/_parser.py \
            tests/test_spef_semantic.py

      - name: Commit the formatter-only result
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/hephaestus/spef_semantic/_builder.py \
            src/hephaestus/spef_semantic/_common.py \
            src/hephaestus/spef_semantic/_parser.py \
            tests/test_spef_semantic.py
          git commit -m 'style: format SPEF semantic evidence'
          git push origin HEAD:feat/spef-semantic-evidence
