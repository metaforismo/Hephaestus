name: Repair PVT source syntax

on:
  push:
    branches:
      - feat/qualified-ihp-pvt-evidence

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qualified-ihp-pvt-evidence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply the exact syntax repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/hephaestus/pvt_corner/_source.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if value.get("evidence_level" != (
              "exact_registered_source_to_routed_sequential_equivalence"
          ):
          '''
          new = '''    if value.get("evidence_level") != (
              "exact_registered_source_to_routed_sequential_equivalence"
          ):
          '''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one malformed evidence-level check')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify the repaired permanent source
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff format src/hephaestus/pvt_corner/_source.py
          ruff check src/hephaestus/pvt_corner tests/test_pvt_corner*.py
          ruff format --check src/hephaestus/pvt_corner tests/test_pvt_corner*.py
          pytest tests/test_pvt_corner.py tests/test_pvt_corner_claim_boundary.py
          python -m py_compile src/hephaestus/pvt_corner/_source.py
          git diff --check
          test "$(git diff --name-only | sort)" = \
            'src/hephaestus/pvt_corner/_source.py'

      - name: Commit only the repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hephaestus/pvt_corner/_source.py
          git diff --cached --check
          git commit -m 'fix: repair PVT source evidence-level validation'
          git push origin HEAD:feat/qualified-ihp-pvt-evidence
