name: One-shot mapped formal merge gate v3

on:
  push:
    branches:
      - feat/ihp-mapped-formal-evidence

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: one-shot-mapped-formal-merge-v3
  cancel-in-progress: true

jobs:
  merge-after-all-pr-workflows:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: feat/ihp-mapped-formal-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ihp-mapped-formal-evidence
          fetch-depth: 0
      - name: Wait for the pull request and all seven evidence workflows
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          repository = os.environ['GITHUB_REPOSITORY']
          owner = repository.split('/', maxsplit=1)[0]
          branch = os.environ['FEATURE_BRANCH']
          head_sha = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          expected = {
              'CI',
              'Evidence',
              'Matched baselines',
              'Synthesis evidence',
              'Formal equivalence',
              'IHP mapped evidence',
              'IHP mapped formal evidence',
          }

          pr_number = None
          for _ in range(30):
              pulls = json.loads(
                  subprocess.check_output(
                      [
                          'gh',
                          'api',
                          '--method',
                          'GET',
                          f'repos/{repository}/pulls',
                          '-f',
                          f'head={owner}:{branch}',
                          '-f',
                          'state=open',
                          '-f',
                          'per_page=10',
                      ],
                      text=True,
                  )
              )
              if pulls:
                  pr_number = int(pulls[0]['number'])
                  break
              time.sleep(2)
          if pr_number is None:
              raise SystemExit('open pull request was not found')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'PR_NUMBER={pr_number}\n')
              handle.write(f'PROVED_HEAD={head_sha}\n')
          print(f'PR #{pr_number}; verified head {head_sha}')

          for attempt in range(150):
              runs = json.loads(
                  subprocess.check_output(
                      [
                          'gh',
                          'api',
                          '--method',
                          'GET',
                          f'repos/{repository}/actions/runs',
                          '-f',
                          f'head_sha={head_sha}',
                          '-f',
                          'event=pull_request',
                          '-f',
                          'per_page=100',
                      ],
                      text=True,
                  )
              ).get('workflow_runs', [])
              latest = {}
              for run in sorted(runs, key=lambda item: item['created_at']):
                  if run['name'] in expected:
                      latest[run['name']] = run

              missing = sorted(expected - set(latest))
              pending = sorted(
                  name for name, run in latest.items() if run['status'] != 'completed'
              )
              failed = sorted(
                  name
                  for name, run in latest.items()
                  if run['status'] == 'completed'
                  and run.get('conclusion') != 'success'
              )
              print(
                  json.dumps(
                      {
                          'attempt': attempt + 1,
                          'missing': missing,
                          'pending': pending,
                          'failed': failed,
                      },
                      sort_keys=True,
                  )
              )
              if failed:
                  for name in failed:
                      print(latest[name]['html_url'])
                  raise SystemExit('a required pull-request workflow failed')
              if not missing and not pending:
                  break
              time.sleep(10)
          else:
              raise SystemExit('timed out waiting for required pull-request workflows')
          PY
      - name: Remove this one-shot gate from the merge commit
        run: |
          git rm .github/workflows/one-shot-merge-mapped-formal-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove the final mapped formal merge gate'
          git push origin HEAD:feat/ihp-mapped-formal-evidence
          echo "MERGE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Squash merge the verified pull request
        run: |
          for _ in $(seq 1 30); do
            remote_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [ "$remote_head" = "$MERGE_HEAD" ]; then
              break
            fi
            sleep 2
          done
          result="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f commit_title='Add mapped standard-cell formal equivalence evidence' \
            -f commit_message='Prove all preserved IHP SG13G2 post-ABC netlists against an independent code-matrix reference with Yosys SAT. Validate source and technology digests, retain proof scripts and logs, and require a data-dependent negative control to produce a counterexample. Timing, power, physical-design, PEX, and silicon claims remain explicitly false.')"
          printf '%s\n' "$result"
          printf '%s\n' "$result" | python -c \
            "import json,sys; assert json.load(sys.stdin)['merged'] is True"
      - name: Delete the merged feature branch
        if: success()
        run: git push origin --delete feat/ihp-mapped-formal-evidence || true
