name: One-shot repository maintenance

on:
  push:
    branches:
      - feat/opensta-timing-evidence

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opensta-timing-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize ignore rules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.gitignore')
          existing = path.read_text(encoding='utf-8') if path.is_file() else ''
          lines = existing.splitlines()
          required = [
              'build/',
              'dist/',
              '*.egg-info/',
              '.venv/',
              '__pycache__/',
              '*.py[cod]',
              '.pytest_cache/',
              '.ruff_cache/',
          ]
          active = {
              line.strip()
              for line in lines
              if line.strip() and not line.lstrip().startswith('#')
          }
          missing = [entry for entry in required if entry not in active]
          if missing:
              if lines and lines[-1].strip():
                  lines.append('')
              lines.append('# Generated local artifacts')
              lines.extend(missing)
          path.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY
      - name: Format and verify hygiene code
        run: |
          python -m pip install 'ruff==0.16.3'
          ruff check --fix scripts/check_repo_hygiene.py
          ruff format scripts/check_repo_hygiene.py
          ruff check scripts/check_repo_hygiene.py
          ruff format --check scripts/check_repo_hygiene.py
          python scripts/check_repo_hygiene.py
      - name: Remove the one-shot workflow and commit maintenance
        run: |
          rm .github/workflows/one-shot-maintenance-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore README.md scripts/check_repo_hygiene.py \
            .github/workflows/repository-hygiene.yml \
            .github/workflows/one-shot-maintenance-fix.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Apply repository hygiene after timing evidence'
            git push origin HEAD:feat/opensta-timing-evidence
          fi
      - name: Prune obsolete remote probe branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          branches=(
            research/ihp-mapped-sat-probe
            research/ihp-sg13g2-mapping-probe
            feat/ihp-sg13g2-mapped-evidence
            feat/ihp-mapped-formal-evidence
            research/opensta-timing-probe
            research/opensta-timing-probe-v2
            research/opensta-timing-probe-v3
            research/opensta-timing-probe-final
            research/opensta-timing-probe-20260818
            research/opensta-timing-probe-20260818a
            research/opensta-timing-probe-20260818b
            research/opensta-timing-probe-active
            research/opensta-timing-probe-active2
            research/opensta-timing-probe-canonical
            research/opensta-timing-probe-canonical2
            research/opensta-timing-probe-CANONICAL
            research/opensta-timing-probe-actual
            research/opensta-timing-probe-actual-final
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch" || true
            fi
          done
