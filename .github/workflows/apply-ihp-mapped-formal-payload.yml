name: Apply IHP mapped formal evidence payload

on:
  push:
    branches:
      - feat/ihp-mapped-formal-evidence

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ihp-mapped-formal-evidence
      - name: Reconstruct and verify the staged payload
        run: |
          set -euo pipefail
          cat .bootstrap/ihp-mapped-formal/payload.part* > /tmp/hephaestus-payload.b64
          printf '%s  %s\n' \
            ea7bd4416d6a951ffc10c8c0114534e5628d072a2bb6f21a12c227df83bd1974 \
            /tmp/hephaestus-payload.b64 \
            | sha256sum --check --strict
          base64 --decode /tmp/hephaestus-payload.b64 > /tmp/hephaestus-payload.tar.gz
          printf '%s  %s\n' \
            6719813240f541bc153f2965814218bc5e3a7e370c17d29f3d2fd08fec5323d2 \
            /tmp/hephaestus-payload.tar.gz \
            | sha256sum --check --strict
          tar -xzf /tmp/hephaestus-payload.tar.gz -C .
      - name: Verify extracted source files
        run: |
          set -euo pipefail
          cat > /tmp/hephaestus-files.sha256 <<'EOF'
          58502d808302df1eec9f48c7023ea229b4c359a339a82c36dace6db77e8e2559  .github/workflows/ihp-mapped-formal-evidence.yml
          e678c96338b8b8d74f19641667deb51870edd23d04071882175878fedc7fd280  README.md
          ca52867df8673324612502333620856eaa78e2dbd85382df644cf30e4530eb90  docs/MAPPED_FORMAL_EQUIVALENCE.md
          efed775d8353ff5e87351d1885dab45dabea3c52d329024f1c87123f90ee439e  docs/MAPPED_SYNTHESIS.md
          ff269c1c330ae9dfdc15d7eece1efb372d979e6accc48ba781aad70c37b1542c  src/hephaestus/mapped_formal.py
          21b45e37d50144f855f570bd276dc67b265db27b5ab362edc0ccb9b4c4064512  tests/test_mapped_formal.py
          EOF
          sha256sum --check --strict /tmp/hephaestus-files.sha256
          python -m py_compile \
            src/hephaestus/mapped_formal.py \
            tests/test_mapped_formal.py
      - name: Replace the research probe with production evidence
        run: |
          set -euo pipefail
          rm -f .github/workflows/ihp-mapped-sat-probe.yml
          rm -rf .bootstrap/ihp-mapped-formal
          rm -f .github/workflows/apply-ihp-mapped-formal-payload.yml
          git diff --check
      - name: Commit production implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add formal equivalence for IHP mapped netlists'
          git push origin HEAD:feat/ihp-mapped-formal-evidence
