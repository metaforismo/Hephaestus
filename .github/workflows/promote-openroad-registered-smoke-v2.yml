name: One-shot capture OpenROAD smoke result v2

on:
  push:
    branches:
      - research/openroad-registered-smoke

concurrency:
  group: openroad-smoke-promotion-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/openroad-registered-smoke
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for the exact-head smoke workflow
        run: |
          set -euo pipefail
          mkdir -p build/openroad-smoke-promotion-v2
          for attempt in $(seq 1 240); do
            gh run list \
              --branch research/openroad-registered-smoke \
              --event push \
              --limit 50 \
              --json databaseId,headSha,status,conclusion,workflowName \
              > build/openroad-smoke-promotion-v2/runs.json
            python - <<'PY' > build/openroad-smoke-promotion-v2/match.env
          import json
          import os
          from pathlib import Path

          runs = json.loads(
              Path('build/openroad-smoke-promotion-v2/runs.json').read_text(
                  encoding='utf-8'
              )
          )
          matches = [
              run for run in runs
              if run.get('headSha') == os.environ['SOURCE_HEAD_SHA']
              and run.get('workflowName') == 'Research OpenROAD registered-tile smoke'
          ]
          if not matches:
              print('MATCHED=false')
          else:
              run = max(matches, key=lambda item: int(item['databaseId']))
              print('MATCHED=true')
              print(f"RUN_ID={int(run['databaseId'])}")
              print(f"RUN_STATUS={run.get('status') or ''}")
              print(f"RUN_CONCLUSION={run.get('conclusion') or ''}")
          PY
            # shellcheck disable=SC1091
            source build/openroad-smoke-promotion-v2/match.env
            if [ "${MATCHED:-false}" = true ]; then
              if [ "${RUN_STATUS:-}" = completed ]; then
                if [ "${RUN_CONCLUSION:-}" != success ]; then
                  echo "Exact-head OpenROAD smoke failed: run=$RUN_ID conclusion=$RUN_CONCLUSION"
                  exit 1
                fi
                printf '%s\n' "$RUN_ID" \
                  > build/openroad-smoke-promotion-v2/run-id.txt
                exit 0
              fi
              echo "Waiting for run $RUN_ID: status=$RUN_STATUS"
            else
              echo "Waiting for an OpenROAD smoke run on $SOURCE_HEAD_SHA"
            fi
            sleep 30
          done
          echo 'Timed out waiting for the exact-head OpenROAD smoke workflow.'
          exit 1

      - name: Download the complete smoke evidence
        run: |
          set -euo pipefail
          run_id=$(cat build/openroad-smoke-promotion-v2/run-id.txt)
          mkdir -p build/openroad-smoke-promotion-v2/artifact
          gh run download "$run_id" \
            --name hephaestus-openroad-registered-shared-dag-smoke \
            --dir build/openroad-smoke-promotion-v2/artifact

      - name: Pin the qualifying smoke result
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          root = Path('build/openroad-smoke-promotion-v2/artifact')
          matches = list(root.rglob('openroad_smoke_manifest.json'))
          if len(matches) != 1:
              raise SystemExit(
                  f'expected one openroad_smoke_manifest.json, found {matches}'
              )
          manifest = json.loads(matches[0].read_text(encoding='utf-8'))
          if manifest.get('schema') != 'hephaestus.openroad-registered-smoke.v1':
              raise SystemExit('unexpected OpenROAD smoke schema')
          if manifest['source']['github_head_sha'] != os.environ['SOURCE_HEAD_SHA']:
              raise SystemExit('downloaded smoke artifact belongs to another head')

          claims = manifest['claims']
          required_true = (
              'registered_source_binding_verified',
              'single_backend_orfs_flow_completed',
              'placement_performed',
              'routing_performed',
              'gds_generated',
          )
          required_false = (
              'matched_three_backend_physical_comparison_performed',
              'post_physical_equivalence_verified',
              'drc_clean',
              'lvs_clean',
              'power_estimated_with_activity',
              'post_layout_pex_verified',
              'foundry_signoff_complete',
              'silicon_verified',
          )
          if any(claims.get(name) is not True for name in required_true):
              raise SystemExit('smoke artifact is missing a required positive claim')
          if any(claims.get(name) is not False for name in required_false):
              raise SystemExit('smoke artifact overstates its claim boundary')

          run_id = int(
              Path('build/openroad-smoke-promotion-v2/run-id.txt')
              .read_text(encoding='utf-8')
              .strip()
          )
          reference = {
              'schema': 'hephaestus.openroad-registered-smoke-reference.v1',
              'reference_id': 'ihp-sg13g2-openroad-registered-shared-dag-smoke-v1',
              'qualifying_run': {
                  'workflow_run_id': run_id,
                  'head_sha': os.environ['SOURCE_HEAD_SHA'],
              },
              'source': {
                  'registered_manifest_sha256': manifest['source'][
                      'registered_manifest_sha256'
                  ],
                  'core_sha256': manifest['source']['core_sha256'],
                  'wrapper_sha256': manifest['source']['wrapper_sha256'],
              },
              'toolchain': manifest['toolchain'],
              'physical_contract': manifest['physical_contract'],
              'artifacts': {
                  label: {
                      'size_bytes': value['size_bytes'],
                      'sha256': value['sha256'],
                  }
                  for label, value in sorted(manifest['artifacts'].items())
              },
              'claims': claims,
          }
          reference_path = Path(
              'benchmarks/reference/'
              'ihp_sg13g2_openroad_registered_shared_dag_smoke_v1.json'
          )
          reference_path.parent.mkdir(parents=True, exist_ok=True)
          reference_path.write_text(
              json.dumps(reference, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          artifacts = reference['artifacts']
          rows = []
          for label in ('final_gds', 'final_def', 'final_verilog', 'final_odb', 'final_spef'):
              if label in artifacts:
                  value = artifacts[label]
                  rows.append(
                      f"| `{label}` | {value['size_bytes']} | `{value['sha256']}` |"
                  )
          result_path = Path('flows/openroad/registered_shared_dag/PROBE_RESULT.md')
          result_path.write_text(
              f'''# OpenROAD registered shared-DAG smoke result

This research probe completed the first RTL-to-GDS execution of a digest-bound registered
Hephaestus tile on the IHP SG13G2 ORFS platform.

```text
workflow run: {run_id}
head SHA: {os.environ['SOURCE_HEAD_SHA']}
ORFS image: {reference['toolchain']['orfs_image_repo_digest']}
clock period: {reference['physical_contract']['clock_period_ns']} ns
floorplan: 240 µm × 240 µm die, 200 µm × 200 µm core
```

| Artifact | Bytes | SHA-256 |
|---|---:|---|
{chr(10).join(rows)}

The qualifying bundle proves only that this one registered shared-DAG design completed the
captured ORFS flow and emitted the listed physical artifacts under the committed contract. It is
not yet a matched three-backend comparison, post-physical equivalence proof, DRC/LVS result,
activity-based power result, validated PEX result, foundry sign-off, or silicon evidence.

The permanent implementation must pin the captured ORFS image digest, run all three registered
backends under one identical physical boundary, repeat each run, and add downstream equivalence
before publishing comparative physical metrics.
''',
              encoding='utf-8',
          )
          PY

      - name: Rebase onto the latest research branch and commit once
        run: |
          set -euo pipefail
          git fetch origin research/openroad-registered-smoke
          git rebase origin/research/openroad-registered-smoke
          rm -f \
            .github/workflows/promote-openroad-registered-smoke.yml \
            .github/workflows/promote-openroad-registered-smoke-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'The qualifying result is already pinned.'
            exit 0
          fi
          git commit -m 'Pin the qualifying OpenROAD registered-tile smoke result'
          git push origin HEAD:research/openroad-registered-smoke
