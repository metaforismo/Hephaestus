name: Bootstrap pinned OpenSTA timing evidence

on:
  push:
    branches:
      - feat/opensta-timing-evidence

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/opensta-timing-evidence
      - name: Promote the verified probe into the permanent workflow
        run: |
          set -euo pipefail
          python - <<'PY_BOOTSTRAP'
          from pathlib import Path

          template_path = Path('.github/opensta-production.yml')
          workflow_path = Path('.github/workflows/opensta-timing-evidence.yml')
          text = template_path.read_text(encoding='utf-8')
          replacements = {
              'name: Pinned OpenSTA SDC timing probe': (
                  'name: Pinned OpenSTA SDC timing evidence'
              ),
              '      - research/opensta-sdc-probe': (
                  '      - main\n      - feat/opensta-timing-evidence'
              ),
              '--module hephaestus_opensta_source': (
                  '--module hephaestus_abc_area_delay_source'
              ),
              '--module hephaestus_opensta \\': (
                  '--module hephaestus_abc_area_delay \\'
              ),
              '--seed 41': '--seed 43',
              'name: hephaestus-pinned-opensta-sdc-timing-probe': (
                  'name: hephaestus-pinned-opensta-sdc-timing-evidence'
              ),
              'retention-days: 14': 'retention-days: 30',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing workflow replacement marker: {old!r}')
              text = text.replace(old, new, 1)

          marker = '      - name: Upload complete timing evidence\n'
          if marker not in text:
              raise SystemExit('missing timing artifact upload marker')
          binding_step = '''      - name: Bind timed netlists to the formal regression reference
        run: |
          python - <<'PY_FORMAL_BINDING'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          probe_path = Path(
              'build/opensta-sdc-probe/sdc/opensta_sdc_probe.json'
          )
          reference_path = Path(
              'benchmarks/reference/'
              'ihp_sg13g2_abc_area_delay_formal_tiny_v1.json'
          )
          probe = json.loads(probe_path.read_text(encoding='utf-8'))
          reference = json.loads(reference_path.read_text(encoding='utf-8'))
          assert reference['schema'] == (
              'hephaestus.abc-area-delay-formal-reference.v1'
          )
          assert reference['claim_boundary'][
              'all_abc_sweep_mapped_netlists_equivalent'
          ]
          assert reference['case']['unique_mapped_netlists'] == 6
          results = {
              (item['backend'], item['label']): item
              for item in probe['results']
          }
          assert len(results) == 6
          for backend, expected in reference['expected'].items():
              for label in expected['pareto_labels']:
                  item = results[(backend, label)]
                  assert item['mapped_verilog_sha256'] == (
                      expected['runs'][label]['sha256']
                  )
                  assert item['repeatability_passed']
                  assert item['attempts'] == 2
          preserved = Path(
              'build/opensta-sdc-probe/sdc/'
              'source_abc_area_delay_formal_reference.json'
          )
          shutil.copyfile(reference_path, preserved)
          digest = hashlib.sha256(preserved.read_bytes()).hexdigest()
          Path(
              'build/opensta-sdc-probe/sdc/'
              'source_abc_area_delay_formal_reference.sha256.txt'
          ).write_text(digest + '\n', encoding='utf-8')
          PY_FORMAL_BINDING
'''
          text = text.replace(marker, binding_step + marker, 1)
          workflow_path.write_text(text, encoding='utf-8')
          template_path.unlink()
          PY_BOOTSTRAP
          python - <<'PY_VALIDATE'
          from pathlib import Path

          path = Path('.github/workflows/opensta-timing-evidence.yml')
          text = path.read_text(encoding='utf-8')
          assert text.startswith('name: Pinned OpenSTA SDC timing evidence\n')
          assert '\npermissions:\n  contents: read\n' in text
          assert 'Bind timed netlists to the formal regression reference' in text
          assert not Path('.github/opensta-production.yml').exists()
          PY_VALIDATE
      - name: Commit the permanent workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install pinned OpenSTA timing evidence workflow'
          git push origin HEAD:feat/opensta-timing-evidence
