name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-and-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install EDA smoke-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog yosys
      - name: Install Hephaestus
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest
      - name: Compile example
        run: |
          hephaestus compile examples/tiny_weights.json \
            --out build/tiny \
            --module hephaestus_tiny \
            --verify-samples 256
      - name: Parse and synthesize generated RTL
        run: ./scripts/check_rtl.sh build/tiny/hephaestus_tiny.sv hephaestus_tiny
      - name: Upload compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-tiny-py${{ matrix.python-version }}
          path: build/tiny
