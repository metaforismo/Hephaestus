name: Format structural probe

on:
  push:
    branches:
      - research/postphysical-equiv-structural-v2

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/postphysical-equiv-structural-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format and commit the research probe
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.4
          ruff check --fix flows/openroad/post_physical_equivalence/run_structural_probe.py
          ruff format flows/openroad/post_physical_equivalence/run_structural_probe.py
          ruff check flows/openroad/post_physical_equivalence/run_structural_probe.py
          ruff format --check flows/openroad/post_physical_equivalence/run_structural_probe.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flows/openroad/post_physical_equivalence/run_structural_probe.py
          git commit -m 'Format the structural post-physical probe'
          git push origin HEAD:research/postphysical-equiv-structural-v2
