name: One-shot finalize OpenROAD physical reference

on:
  push:
    branches:
      - feat/openroad-physical-evidence

concurrency:
  group: finalize-openroad-physical-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openroad-physical-evidence
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Require and inspect the qualifying reference
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              'benchmarks/reference/ihp_sg13g2_openroad_physical_tiny_v1.json'
          )
          reference = json.loads(path.read_text(encoding='utf-8'))
          assert reference['schema'] == 'hephaestus.openroad-physical-reference.v1'
          assert reference['reference_id'] == 'ihp-sg13g2-openroad-physical-tiny-v1'
          assert set(reference['backends']) == {
              'shared_dag',
              'naive_shift_add',
              'constant_multipliers',
          }
          assert reference['claims']['physical_repeatability_verified']
          assert reference['claims']['comparative_ppa_claim_enabled'] is False
          PY

      - name: Add exact stable-reference validation to CI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/openroad-physical-evidence.yml')
          text = path.read_text(encoding='utf-8')
          marker = '      - name: Upload the bound matched physical evidence\n'
          step = '''      - name: Validate the pinned physical regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path(
                  'build/openroad-physical/evidence/openroad_physical_evidence.json'
              ).read_text(encoding='utf-8')
          )
          reference = json.loads(
              Path(
                  'benchmarks/reference/ihp_sg13g2_openroad_physical_tiny_v1.json'
              ).read_text(encoding='utf-8')
          )
          assert reference['schema'] == 'hephaestus.openroad-physical-reference.v1'
          assert reference['reference_id'] == (
              'ihp-sg13g2-openroad-physical-tiny-v1'
          )
          assert evidence['toolchain'] == reference['toolchain']
          assert evidence['contract'] == reference['contract']
          assert evidence['claims'] == reference['claims']
          assert evidence['source'] == reference['source']

          stable_repeatability_keys = {
              'passed',
              'byte_identical',
              'gds_timestamp_normalized_identical',
              'def_metrics_identical',
              'stable_metadata_metrics_identical',
          }
          for backend_name, expected in reference['backends'].items():
              actual = evidence['backends'][backend_name]
              assert actual['core_sha256'] == expected['core_sha256']
              assert actual['wrapper_sha256'] == expected['wrapper_sha256']
              assert actual['gds_timestamp_normalized_sha256'] == (
                  expected['gds_timestamp_normalized_sha256']
              )
              assert actual['observed_def_metrics'] == expected[
                  'observed_def_metrics'
              ]
              assert actual['observed_physical_metrics'] == expected[
                  'observed_physical_metrics'
              ]
              assert {
                  key: actual['repeatability'][key]
                  for key in stable_repeatability_keys
              } == {
                  key: expected['repeatability'][key]
                  for key in stable_repeatability_keys
              }
              first_artifacts = actual['runs'][0]['artifacts']
              expected_artifacts = expected['first_attempt_artifacts']
              for label in ('final_def', 'final_verilog', 'final_spef'):
                  assert first_artifacts[label]['sha256'] == (
                      expected_artifacts[label]['sha256']
                  )
                  assert first_artifacts[label]['size_bytes'] == (
                      expected_artifacts[label]['size_bytes']
                  )
          PY

'''
          if '      - name: Validate the pinned physical regression\n' not in text:
              if marker not in text:
                  raise SystemExit('physical artifact-upload marker not found')
              text = text.replace(marker, step + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Publish the bounded result in project documentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reference = json.loads(
              Path(
                  'benchmarks/reference/ihp_sg13g2_openroad_physical_tiny_v1.json'
              ).read_text(encoding='utf-8')
          )
          rows = []
          for backend_name, backend in reference['backends'].items():
              metrics = backend['observed_def_metrics']
              rows.append(
                  f"| `{backend_name}` | {metrics['component_count']} | "
                  f"{metrics['net_count']} | "
                  f"`{backend['gds_timestamp_normalized_sha256']}` |"
              )
          section = f'''<!-- OPENROAD_PHYSICAL_RESULT_START -->
## First matched registered OpenROAD physical result

The three registered microcase backends now complete two isolated IHP SG13G2 ORFS runs each under
one pinned container image and one fixed 4 ns, 240 µm × 240 µm die, 200 µm × 200 µm core,
0.50-density, Metal2–Metal5 contract.

| Backend | Final DEF components | Final DEF nets | Timestamp-normalized GDS SHA-256 |
|---|---:|---:|---|
{chr(10).join(rows)}

For every backend, the two attempts reproduce byte-identical final DEF, mapped Verilog, and SPEF,
identical parsed DEF and stable numeric ORFS metrics, and identical GDS content after removing only
GDSII library/structure timestamps. The complete source, image, contract, output, and run-manifest
digests are pinned in
`benchmarks/reference/ihp_sg13g2_openroad_physical_tiny_v1.json`.

This result establishes matched physical execution and repeatability, not architectural PPA
superiority. Routed sequential netlists have not yet received downstream equivalence, so
comparative PPA remains disabled. Independent DRC/LVS, activity-based power, validated PEX,
foundry sign-off, and silicon also remain unverified. See
[Matched registered OpenROAD physical evidence](docs/OPENROAD_PHYSICAL_EVIDENCE.md).
<!-- OPENROAD_PHYSICAL_RESULT_END -->'''

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          start = '<!-- OPENROAD_PHYSICAL_RESULT_START -->'
          end = '<!-- OPENROAD_PHYSICAL_RESULT_END -->'
          if start in text:
              prefix, remainder = text.split(start, 1)
              _, suffix = remainder.split(end, 1)
              text = prefix + section + suffix
          else:
              marker = '\n## Research thesis\n'
              if marker not in text:
                  raise SystemExit('README research-thesis marker not found')
              text = text.replace(marker, '\n' + section + marker, 1)
          text = text.replace(
              'proved Pareto netlists with digest-level proof binding, and matched registered streaming wrappers',
              'proved Pareto netlists with digest-level proof binding, matched registered streaming wrappers, and repeatable matched IHP OpenROAD physical executions',
          )
          readme.write_text(text, encoding='utf-8')

          docs = Path('docs/OPENROAD_PHYSICAL_EVIDENCE.md')
          docs_text = docs.read_text(encoding='utf-8')
          pinned = f'''\n## Pinned regression\n\nThe qualifying workflow run is `{reference['qualifying_run']['workflow_run_id']}` on head:\n\n```text\n{reference['qualifying_run']['head_sha']}\n```\n\nThe regression reference pins the ORFS image, prepared-source and contract digests, normalized GDS\ncontent, parsed DEF structure, stable ORFS metrics, stable repeatability fields, and byte-stable final\nDEF/Verilog/SPEF observations for all three backends. Raw GDS timestamps and OpenDB serialization\nremain preserved provenance rather than false cross-run invariants.\n'''
          if '\n## Pinned regression\n' not in docs_text:
              marker = '\n## Claim boundary\n'
              if marker not in docs_text:
                  raise SystemExit('physical documentation claim marker not found')
              docs_text = docs_text.replace(marker, pinned + marker, 1)
          docs.write_text(docs_text, encoding='utf-8')

          openroad = Path('flows/openroad/README.md')
          openroad_text = openroad.read_text(encoding='utf-8')
          status = '''\n## Current matched physical status\n\nThe 4×6 registered microcase has now completed two pinned ORFS attempts for each of the shared DAG,\nnaive shift/add, and constant-multiplier backends under one fixed physical boundary. Stable\nartifacts and normalized metrics are regression-pinned. The next gate is sequential equivalence of\nthe routed netlists; comparative PPA remains disabled until that proof is bound to the exact final\nVerilog and physical artifact digests.\n'''
          if '\n## Current matched physical status\n' not in openroad_text:
              openroad_text += status
          openroad.write_text(openroad_text, encoding='utf-8')
          PY

      - name: Remove the one-shot workflow and verify repository quality
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-openroad-physical-reference.yml
          python -m pip install -e '.[dev]'
          ruff check src/hephaestus/openroad_physical.py tests/test_openroad_physical.py
          ruff format --check \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py
          pytest tests/test_openroad_physical.py
          python scripts/check_repo_hygiene.py

      - name: Commit the finalized physical evidence layer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize the matched OpenROAD physical regression'
          git push origin HEAD:feat/openroad-physical-evidence
