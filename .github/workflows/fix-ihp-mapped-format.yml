name: One-shot mapped evidence formatting fix

on:
  push:
    branches: [feat/ihp-sg13g2-mapped-evidence]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ihp-sg13g2-mapped-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.16.3'
      - name: Fix and verify
        run: |
          ruff check --fix src/hephaestus/mapped.py tests/test_mapped.py
          ruff format src/hephaestus/mapped.py tests/test_mapped.py
          ruff check src/hephaestus/mapped.py tests/test_mapped.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hephaestus/mapped.py tests/test_mapped.py
          git commit -m 'Format IHP mapped evidence code'
          git push origin HEAD:feat/ihp-sg13g2-mapped-evidence
