name: One-shot cleanup PVT research scaffolding

on:
  push:
    branches:
      - research/ihp-pvt-corner-probe

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ihp-pvt-corner-probe
      - name: Remove one-shot workflows and commit the clean research tree
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/one-shot-format-pvt-corner.yml \
            .github/workflows/cleanup-pvt-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove PVT research assembly workflows'
          git push origin HEAD:research/ihp-pvt-corner-probe
