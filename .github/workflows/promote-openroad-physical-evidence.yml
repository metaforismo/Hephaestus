name: One-shot capture OpenROAD physical result

on:
  pull_request:

concurrency:
  group: openroad-physical-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: >-
      github.head_ref == 'feat/openroad-physical-evidence' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openroad-physical-evidence
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for the exact-head physical workflow
        run: |
          set -euo pipefail
          mkdir -p build/openroad-physical-promotion
          for attempt in $(seq 1 320); do
            gh run list \
              --branch feat/openroad-physical-evidence \
              --event pull_request \
              --limit 80 \
              --json databaseId,headSha,status,conclusion,workflowName \
              > build/openroad-physical-promotion/runs.json
            python - <<'PY' > build/openroad-physical-promotion/match.env
          import json
          import os
          from pathlib import Path

          runs = json.loads(
              Path('build/openroad-physical-promotion/runs.json').read_text(
                  encoding='utf-8'
              )
          )
          matches = [
              run for run in runs
              if run.get('headSha') == os.environ['SOURCE_HEAD_SHA']
              and run.get('workflowName') == 'Pinned IHP OpenROAD physical evidence'
          ]
          if not matches:
              print('MATCHED=false')
          else:
              run = max(matches, key=lambda item: int(item['databaseId']))
              print('MATCHED=true')
              print(f"RUN_ID={int(run['databaseId'])}")
              print(f"RUN_STATUS={run.get('status') or ''}")
              print(f"RUN_CONCLUSION={run.get('conclusion') or ''}")
          PY
            # shellcheck disable=SC1091
            source build/openroad-physical-promotion/match.env
            if [ "${MATCHED:-false}" = true ]; then
              if [ "${RUN_STATUS:-}" = completed ]; then
                if [ "${RUN_CONCLUSION:-}" != success ]; then
                  echo "Exact-head physical workflow failed: run=$RUN_ID conclusion=$RUN_CONCLUSION"
                  gh run view "$RUN_ID" --log-failed \
                    > build/openroad-physical-promotion/failed.log 2>&1 || true
                  tail -n 400 build/openroad-physical-promotion/failed.log || true
                  exit 1
                fi
                printf '%s\n' "$RUN_ID" \
                  > build/openroad-physical-promotion/run-id.txt
                exit 0
              fi
              echo "Waiting for run $RUN_ID: status=$RUN_STATUS"
            else
              echo "Waiting for a physical workflow on $SOURCE_HEAD_SHA"
            fi
            sleep 30
          done
          echo 'Timed out waiting for the exact-head physical workflow.'
          exit 1

      - name: Download the qualifying bound evidence
        run: |
          set -euo pipefail
          run_id=$(cat build/openroad-physical-promotion/run-id.txt)
          mkdir -p build/openroad-physical-promotion/artifact
          gh run download "$run_id" \
            --name hephaestus-ihp-openroad-physical-evidence \
            --dir build/openroad-physical-promotion/artifact

      - name: Pin the stable physical regression
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          artifact_root = Path('build/openroad-physical-promotion/artifact')
          matches = list(artifact_root.rglob('openroad_physical_evidence.json'))
          if len(matches) != 1:
              raise SystemExit(
                  f'expected one physical evidence manifest, found {matches}'
              )
          evidence = json.loads(matches[0].read_text(encoding='utf-8'))
          if evidence.get('schema') != 'hephaestus.openroad-physical-evidence.v1':
              raise SystemExit('unexpected physical evidence schema')
          claims = evidence.get('claims')
          if not isinstance(claims, dict):
              raise SystemExit('physical evidence claims are malformed')
          required_true = (
              'registered_source_binding_verified',
              'pinned_orfs_image_used',
              'all_three_backends_placed',
              'all_three_backends_routed',
              'all_three_backends_emitted_gds',
              'all_three_backends_emitted_spef',
              'two_attempts_per_backend_completed',
              'physical_repeatability_verified',
              'physical_metrics_recorded',
              'common_physical_boundary_verified',
          )
          required_false = (
              'post_physical_equivalence_verified',
              'comparative_ppa_claim_enabled',
              'drc_clean',
              'lvs_clean',
              'power_estimated_with_activity',
              'post_layout_pex_verified',
              'foundry_signoff_complete',
              'silicon_verified',
          )
          if any(claims.get(name) is not True for name in required_true):
              raise SystemExit('physical evidence lacks a required positive claim')
          if any(claims.get(name) is not False for name in required_false):
              raise SystemExit('physical evidence overstates its claim boundary')

          run_id = int(
              Path('build/openroad-physical-promotion/run-id.txt')
              .read_text(encoding='utf-8')
              .strip()
          )
          backends = {}
          for backend_name, backend in sorted(evidence['backends'].items()):
              first = backend['runs'][0]
              backends[backend_name] = {
                  'core_sha256': backend['core_sha256'],
                  'wrapper_sha256': backend['wrapper_sha256'],
                  'repeatability': backend['repeatability'],
                  'gds_timestamp_normalized_sha256': backend[
                      'gds_timestamp_normalized_sha256'
                  ],
                  'observed_def_metrics': backend['observed_def_metrics'],
                  'observed_physical_metrics': backend[
                      'observed_physical_metrics'
                  ],
                  'first_attempt_artifacts': {
                      label: {
                          'size_bytes': value['size_bytes'],
                          'sha256': value['sha256'],
                      }
                      for label, value in sorted(first['artifacts'].items())
                  },
              }
          reference = {
              'schema': 'hephaestus.openroad-physical-reference.v1',
              'reference_id': 'ihp-sg13g2-openroad-physical-tiny-v1',
              'qualifying_run': {
                  'workflow_run_id': run_id,
                  'head_sha': os.environ['SOURCE_HEAD_SHA'],
              },
              'source': evidence['source'],
              'toolchain': evidence['toolchain'],
              'contract': evidence['contract'],
              'backends': backends,
              'claims': claims,
          }
          reference_path = Path(
              'benchmarks/reference/ihp_sg13g2_openroad_physical_tiny_v1.json'
          )
          reference_path.parent.mkdir(parents=True, exist_ok=True)
          reference_path.write_text(
              json.dumps(reference, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          rows = []
          for backend_name, backend in backends.items():
              def_metrics = backend['observed_def_metrics']
              rows.append(
                  f"| `{backend_name}` | {def_metrics['component_count']} | "
                  f"{def_metrics['net_count']} | "
                  f"`{backend['gds_timestamp_normalized_sha256']}` |"
              )
          result = f'''# Qualifying matched OpenROAD physical result

```text
workflow run: {run_id}
head SHA: {os.environ['SOURCE_HEAD_SHA']}
ORFS image: {reference['toolchain']['orfs_image_repo_digest']}
attempts: 2 per backend
```

| Backend | Components | Nets | Timestamp-normalized GDS SHA-256 |
|---|---:|---:|---|
{chr(10).join(rows)}

All three registered backends completed placement and routing twice under the same physical
contract, and the declared repeatability checks passed. These observations are pinned for future
regression detection, but they are not yet a comparative PPA claim. Post-physical equivalence,
independent DRC/LVS, activity-based power, validated PEX, foundry sign-off, and silicon remain
explicitly unverified.
'''
          Path('flows/openroad/PHYSICAL_RESULT.md').write_text(
              result,
              encoding='utf-8',
          )
          PY

      - name: Update the roadmap without publishing comparative PPA
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          marker = '## M4 — Open-PDK RTL-to-GDS\n'
          note = '''## M3.75 — Matched OpenROAD physical execution — implemented for the microcase

- Three registered backends run under one pinned IHP SG13G2 ORFS image and one fixed physical
  boundary.
- Two isolated attempts per backend preserve GDS, DEF, mapped Verilog, OpenDB, SPEF, metadata, and
  complete flow provenance.
- Repeatability binds byte-stable DEF/Verilog/SPEF, timestamp-normalized GDS content, parsed DEF
  structure, and stable numeric ORFS metrics.
- Comparative PPA remains disabled until routed sequential netlists receive downstream equivalence.

**Exit criterion met for execution only:** all six physical attempts completed and repeated under
one boundary. DRC/LVS, post-physical equivalence, activity-based power, validated PEX, and sign-off
remain M4 work.

'''
          if note not in text:
              if marker not in text:
                  raise SystemExit('roadmap M4 marker was not found')
              text = text.replace(marker, note + marker, 1)
          roadmap.write_text(text, encoding='utf-8')
          PY

      - name: Remove the promoter and commit the qualifying reference
        run: |
          set -euo pipefail
          rm .github/workflows/promote-openroad-physical-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Pin the qualifying matched OpenROAD physical result'
          git push origin HEAD:feat/openroad-physical-evidence
