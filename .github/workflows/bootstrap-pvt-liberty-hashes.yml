name: Bootstrap PVT Liberty hashes

on:
  push:
    branches:
      - feat/qualified-ihp-pvt-evidence

permissions:
  contents: read

jobs:
  hashes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/checkout@v4
        with:
          repository: IHP-GmbH/IHP-Open-PDK
          ref: 22f2a25f1734796de3debbbf29cf697cbbc54081
          path: build/ihp-open-pdk
          fetch-depth: 1

      - name: Bind the exact three Liberty files
        run: |
          set -euo pipefail
          root='build/ihp-open-pdk/ihp-sg13g2/libs.ref/sg13g2_stdcell/lib'
          for file in \
            sg13g2_stdcell_slow_1p08V_125C.lib \
            sg13g2_stdcell_typ_1p20V_25C.lib \
            sg13g2_stdcell_fast_1p32V_m40C.lib
          do
            test -s "$root/$file"
            sha256sum "$root/$file"
          done
          test "$(git -C build/ihp-open-pdk rev-parse HEAD)" = \
            22f2a25f1734796de3debbbf29cf697cbbc54081
