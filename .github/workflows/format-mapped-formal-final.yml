name: Final one-shot mapped formal formatting

on:
  push:
    branches:
      - feat/ihp-mapped-formal-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ihp-mapped-formal-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Ruff formatting
        run: |
          python -m pip install 'ruff==0.16.3'
          ruff check --fix src/hephaestus/mapped_formal.py tests/test_mapped_formal.py
          ruff format src/hephaestus/mapped_formal.py tests/test_mapped_formal.py
          ruff check src/hephaestus/mapped_formal.py tests/test_mapped_formal.py
      - name: Remove the one-shot workflow and commit
        run: |
          git rm .github/workflows/format-mapped-formal-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hephaestus/mapped_formal.py tests/test_mapped_formal.py
          git commit -m 'Finalize mapped formal evidence formatting'
          git push origin HEAD:feat/ihp-mapped-formal-evidence
