name: One-shot format OpenROAD smoke validator

on:
  push:
    branches:
      - research/openroad-registered-smoke

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/openroad-registered-smoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format and verify the validator
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.3
          ruff check --fix \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          ruff format \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          ruff check \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          ruff format --check \
            flows/openroad/registered_shared_dag/validate_smoke_reference.py
          python flows/openroad/registered_shared_dag/validate_smoke_reference.py \
            --self-test
      - name: Commit the formatted source only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flows/openroad/registered_shared_dag/validate_smoke_reference.py
          git commit -m 'Format the OpenROAD smoke reference validator'
          git push origin HEAD:research/openroad-registered-smoke
