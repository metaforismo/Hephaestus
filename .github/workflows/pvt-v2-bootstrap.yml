      - name: Format and verify the candidate
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff --version
          ruff format \
            src/hephaestus/pvt_corner \
            tests/test_pvt_corner_v2.py
          ruff check \
            src/hephaestus/pvt_corner \
            tests/test_pvt_corner_v2.py
          ruff format --check \
            src/hephaestus/pvt_corner \
            tests/test_pvt_corner_v2.py
          pytest tests/test_pvt_corner_v2.py
          python -m compileall -q \
            src/hephaestus/pvt_corner \
            tests/test_pvt_corner_v2.py
          python -m hephaestus.pvt_corner --help > /dev/null

      - name: Commit the permanent candidate without bootstrap residue
        run: |
          set -euo pipefail
          rm .github/workflows/pvt-v2-bootstrap.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/pvt-corner-evidence.yml \
            .github/workflows/pvt-v2-bootstrap.yml \
            benchmarks/reference/ihp_sg13g2_pvt_corner_tiny_v2.json \
            configs/evidence/ihp_sg13g2_pvt_corner_v2.json \
            docs/PVT_CORNER_EVIDENCE.md \
            src/hephaestus/pvt_corner \
            tests/test_pvt_corner_v2.py
          git commit -m 'feat: add routed IHP Liberty-corner evidence v2'
          git push origin HEAD:feat/ihp-pvt-corner-evidence-v2
