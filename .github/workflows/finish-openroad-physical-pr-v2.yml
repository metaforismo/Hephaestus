name: One-shot finish OpenROAD physical PR v2

on:
  push:
    branches:
      - feat/openroad-physical-evidence

concurrency:
  group: finish-openroad-physical-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      FEATURE_BRANCH: feat/openroad-physical-evidence
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openroad-physical-evidence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Discover the permanent pull request
        run: |
          set -euo pipefail
          pr_number=$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$FEATURE_BRANCH" \
            --state open \
            --json number \
            --jq 'if length == 1 then .[0].number else error("expected one open PR") end')
          printf '%s\n' "$pr_number" > /tmp/openroad-physical-pr-number
          echo "Permanent physical PR: #$pr_number"

      - name: Wait for the qualifying reference and automation cleanup
        run: |
          set -euo pipefail
          reference='benchmarks/reference/ihp_sg13g2_openroad_physical_tiny_v1.json'
          blockers=(
            '.github/workflows/assemble-openroad-physical-evidence.yml'
            '.github/workflows/promote-openroad-physical-evidence.yml'
            '.github/workflows/finalize-openroad-physical-reference.yml'
          )
          for poll in $(seq 1 360); do
            head_sha=$(gh api \
              "repos/$REPOSITORY/git/ref/heads/$FEATURE_BRANCH" \
              --jq '.object.sha')
            ready=true
            if ! gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/$REPOSITORY/contents/$reference?ref=$FEATURE_BRANCH" \
              > /tmp/openroad-physical-reference.json 2>/dev/null; then
              ready=false
            fi
            for blocker in "${blockers[@]}"; do
              if gh api \
                "repos/$REPOSITORY/contents/$blocker?ref=$FEATURE_BRANCH" \
                >/dev/null 2>&1; then
                ready=false
              fi
            done
            if [ "$ready" = true ]; then
              echo "Physical reference and cleaned production tree are present at $head_sha"
              exit 0
            fi

            gh run list \
              --repo "$REPOSITORY" \
              --branch "$FEATURE_BRANCH" \
              --limit 100 \
              --json databaseId,headSha,status,conclusion,workflowName \
              > /tmp/openroad-physical-runs.json
            set +e
            python - "$head_sha" <<'PY'
          import json
          import sys
          from pathlib import Path

          head = sys.argv[1]
          runs = json.loads(
              Path('/tmp/openroad-physical-runs.json').read_text(encoding='utf-8')
          )
          relevant = {
              'One-shot assemble OpenROAD physical evidence',
              'Pinned IHP OpenROAD physical evidence',
              'One-shot capture OpenROAD physical result',
              'One-shot finalize OpenROAD physical reference',
          }
          failed = [
              run for run in runs
              if run.get('headSha') == head
              and run.get('workflowName') in relevant
              and run.get('status') == 'completed'
              and run.get('conclusion') in {
                  'failure', 'timed_out', 'action_required', 'startup_failure'
              }
          ]
          if failed:
              for run in failed:
                  print(
                      f"{run['workflowName']}:{run['databaseId']}:{run['conclusion']}"
                  )
              raise SystemExit(2)
          PY
            status=$?
            set -e
            if [ "$status" -eq 2 ]; then
              echo 'A qualifying automation workflow failed:'
              python - "$head_sha" <<'PY'
          import json
          import sys
          from pathlib import Path
          head = sys.argv[1]
          runs = json.loads(Path('/tmp/openroad-physical-runs.json').read_text())
          for run in runs:
              if (
                  run.get('headSha') == head
                  and run.get('status') == 'completed'
                  and run.get('conclusion') in {
                      'failure', 'timed_out', 'action_required', 'startup_failure'
                  }
              ):
                  print(
                      f"- {run['workflowName']} run={run['databaseId']} "
                      f"conclusion={run['conclusion']}"
                  )
          PY
              exit 1
            fi
            echo "Waiting for qualifying automation at $head_sha (poll $poll/360)"
            sleep 30
          done
          echo 'Timed out waiting for the physical regression reference.'
          exit 1

      - name: Reset to the latest production branch state
        run: |
          set -euo pipefail
          git fetch origin "$FEATURE_BRANCH"
          git checkout -B "$FEATURE_BRANCH" "origin/$FEATURE_BRANCH"
          rm -f \
            .github/workflows/finish-openroad-physical-pr.yml \
            .github/workflows/finish-openroad-physical-pr-v2.yml

      - name: Validate the completed implementation locally
        run: |
          set -euo pipefail
          required=(
            'src/hephaestus/openroad_physical.py'
            'tests/test_openroad_physical.py'
            'configs/physical/ihp_sg13g2_openroad_registered_v1.json'
            'benchmarks/reference/ihp_sg13g2_openroad_registered_shared_dag_smoke_v1.json'
            'benchmarks/reference/ihp_sg13g2_openroad_physical_tiny_v1.json'
            '.github/workflows/openroad-physical-evidence.yml'
            'docs/OPENROAD_PHYSICAL_EVIDENCE.md'
            'flows/openroad/PHYSICAL_RESULT.md'
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "missing required file: $path"; exit 1; }
          done
          test ! -e .github/openroad-physical-parts
          test ! -e .github/workflows/assemble-openroad-physical-evidence.yml
          test ! -e .github/workflows/promote-openroad-physical-evidence.yml
          test ! -e .github/workflows/finalize-openroad-physical-reference.yml

          python -m pip install -e '.[dev]'
          ruff check \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py
          ruff format --check \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py
          pytest tests/test_openroad_physical.py
          python -m hephaestus.openroad_physical --help
          python scripts/check_repo_hygiene.py

          python - <<'PY'
          import json
          from pathlib import Path

          reference = json.loads(
              Path(
                  'benchmarks/reference/ihp_sg13g2_openroad_physical_tiny_v1.json'
              ).read_text(encoding='utf-8')
          )
          assert reference['schema'] == 'hephaestus.openroad-physical-reference.v1'
          assert reference['reference_id'] == 'ihp-sg13g2-openroad-physical-tiny-v1'
          assert set(reference['backends']) == {
              'shared_dag',
              'naive_shift_add',
              'constant_multipliers',
          }
          assert all(
              backend['repeatability']['passed']
              for backend in reference['backends'].values()
          )
          claims = reference['claims']
          assert claims['all_three_backends_placed']
          assert claims['all_three_backends_routed']
          assert claims['physical_repeatability_verified']
          assert claims['post_physical_equivalence_verified'] is False
          assert claims['comparative_ppa_claim_enabled'] is False
          assert claims['drc_clean'] is False
          assert claims['lvs_clean'] is False
          assert claims['post_layout_pex_verified'] is False
          assert claims['silicon_verified'] is False
          PY

      - name: Create the final pull-request head
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize the matched OpenROAD physical evidence PR'
          git push origin HEAD:"$FEATURE_BRANCH"
          git rev-parse HEAD > /tmp/openroad-physical-final-head

      - name: Wait for every exact-head pull-request workflow
        run: |
          set -euo pipefail
          final_head=$(cat /tmp/openroad-physical-final-head)
          required_workflows=(
            'CI'
            'Evidence'
            'Matched baselines'
            'Synthesis evidence'
            'Formal equivalence'
            'IHP mapped evidence'
            'IHP mapped formal equivalence'
            'IHP ABC area-delay evidence'
            'IHP ABC area-delay formal equivalence'
            'Pinned OpenSTA pre-layout timing evidence'
            'Registered matched tiles'
            'Pinned IHP OpenROAD physical evidence'
            'Repository hygiene'
          )
          for poll in $(seq 1 420); do
            gh run list \
              --repo "$REPOSITORY" \
              --branch "$FEATURE_BRANCH" \
              --event pull_request \
              --limit 150 \
              --json databaseId,headSha,status,conclusion,workflowName \
              > /tmp/openroad-physical-final-runs.json
            set +e
            python - "$final_head" "${required_workflows[@]}" <<'PY'
          import json
          import sys
          from pathlib import Path

          head = sys.argv[1]
          required = sys.argv[2:]
          runs = json.loads(
              Path('/tmp/openroad-physical-final-runs.json').read_text(
                  encoding='utf-8'
              )
          )
          by_name = {}
          for run in runs:
              if run.get('headSha') != head:
                  continue
              name = run.get('workflowName')
              previous = by_name.get(name)
              if previous is None or int(run['databaseId']) > int(previous['databaseId']):
                  by_name[name] = run
          missing = [name for name in required if name not in by_name]
          failed = [
              by_name[name]
              for name in required
              if name in by_name
              and by_name[name].get('status') == 'completed'
              and by_name[name].get('conclusion') not in {'success', 'neutral', 'skipped'}
          ]
          pending = [
              by_name[name]
              for name in required
              if name in by_name and by_name[name].get('status') != 'completed'
          ]
          if failed:
              for run in failed:
                  print(
                      'FAILED='
                      f"{run['workflowName']}:{run['databaseId']}:{run['conclusion']}"
                  )
              raise SystemExit(2)
          if missing or pending:
              print('MISSING=' + ','.join(missing))
              print(
                  'PENDING=' + ','.join(
                      f"{run['workflowName']}:{run['status']}" for run in pending
                  )
              )
              raise SystemExit(1)
          print('READY=true')
          PY
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "All exact-head workflows passed on $final_head"
              exit 0
            fi
            if [ "$status" -eq 2 ]; then
              echo 'At least one exact-head workflow failed.'
              python - "$final_head" <<'PY'
          import json
          import sys
          from pathlib import Path
          head = sys.argv[1]
          runs = json.loads(Path('/tmp/openroad-physical-final-runs.json').read_text())
          for run in runs:
              if (
                  run.get('headSha') == head
                  and run.get('status') == 'completed'
                  and run.get('conclusion') not in {'success', 'neutral', 'skipped'}
              ):
                  print(
                      f"- {run['workflowName']} run={run['databaseId']} "
                      f"conclusion={run['conclusion']}"
                  )
          PY
              exit 1
            fi
            echo "Waiting for exact-head workflows (poll $poll/420)"
            sleep 30
          done
          echo 'Timed out waiting for exact-head pull-request workflows.'
          exit 1

      - name: Mark ready and squash-merge the permanent PR
        run: |
          set -euo pipefail
          pr_number=$(cat /tmp/openroad-physical-pr-number)
          final_head=$(cat /tmp/openroad-physical-final-head)
          current_head=$(gh pr view "$pr_number" \
            --repo "$REPOSITORY" \
            --json headRefOid \
            --jq '.headRefOid')
          test "$current_head" = "$final_head"
          gh pr ready "$pr_number" --repo "$REPOSITORY"
          gh pr merge "$pr_number" \
            --repo "$REPOSITORY" \
            --squash \
            --delete-branch \
            --subject 'Add matched registered IHP OpenROAD physical evidence' \
            --body "Run all three registered zero-fetch backends through two pinned IHP SG13G2 ORFS attempts under one fixed physical contract. Preserve and repeatably bind GDS, DEF, mapped Verilog, OpenDB, SPEF, metadata, toolchain, and source provenance. Comparative PPA, post-physical equivalence, DRC/LVS, activity-based power, validated PEX, sign-off, and silicon remain explicitly unclaimed. All exact-head workflows passed on $final_head."

      - name: Retire the research probe after promotion
        run: |
          set -euo pipefail
          research_pr=$(gh pr list \
            --repo "$REPOSITORY" \
            --head research/openroad-registered-smoke \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$research_pr" ]; then
            gh pr comment "$research_pr" \
              --repo "$REPOSITORY" \
              --body 'The qualifying smoke result has been promoted into the permanent matched physical-evidence layer.'
            gh pr close "$research_pr" --repo "$REPOSITORY"
          fi
          gh api \
            --method DELETE \
            "repos/$REPOSITORY/git/refs/heads/research/openroad-registered-smoke" \
            >/dev/null 2>&1 || true
