name: Temporary autoformat

on:
  push:
    branches:
      - feat/bootstrap-model-to-metal-compiler

permissions:
  contents: write

jobs:
  autoformat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-model-to-metal-compiler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.3'
      - name: Apply lint and format fixes
        run: |
          ruff check --fix . || true
          ruff format .
          python - <<'PY'
          from pathlib import Path

          path = Path('src/hephaestus/lower.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '            f"accumulator_width={chosen_width} is unsafe; '
              'at least {minimum_width} bits are required"\n'
          )
          new = (
              '            f"accumulator_width={chosen_width} is unsafe; "\n'
              '            f"at least {minimum_width} bits are required"\n'
          )
          if old not in text:
              raise SystemExit('expected long diagnostic string was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          ruff format .
          ruff check .
          rm .github/workflows/autoformat.yml
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply Ruff formatting fixes'
          git push origin HEAD:feat/bootstrap-model-to-metal-compiler
