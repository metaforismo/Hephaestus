name: One-shot ABC formal formatting fix

on:
  push:
    branches:
      - feat/abc-area-delay-formal-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/abc-area-delay-formal-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Ruff fixes
        run: |
          python -m pip install 'ruff==0.16.3'
          ruff check --fix \
            src/hephaestus/abc_timing_formal.py \
            tests/test_abc_timing_formal.py
          ruff format \
            src/hephaestus/abc_timing_formal.py \
            tests/test_abc_timing_formal.py
          ruff check \
            src/hephaestus/abc_timing_formal.py \
            tests/test_abc_timing_formal.py
          ruff format --check \
            src/hephaestus/abc_timing_formal.py \
            tests/test_abc_timing_formal.py
      - name: Commit only source formatting changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/hephaestus/abc_timing_formal.py \
            tests/test_abc_timing_formal.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'Format ABC area-delay formal evidence'
          git push origin HEAD:feat/abc-area-delay-formal-evidence
