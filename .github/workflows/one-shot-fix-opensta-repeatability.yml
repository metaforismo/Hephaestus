name: One-shot OpenSTA repeatability fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.head_ref == 'research/opensta-sdc-probe' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/opensta-sdc-probe
      - name: Compare report content separately from attempt paths
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/opensta_sdc_probe.py')
          text = path.read_text(encoding='utf-8')
          old = '''        first = attempt_results[0]
        if any(result != first for result in attempt_results[1:]):
            raise ProbeError(f"OpenSTA output is not byte-identical for {run_dir.name}")
        normalized.append(
            {
                **metadata,
                "timing": first,
                "attempts": attempts,
                "repeatability_passed": True,
            }
        )
'''
          new = '''        first = attempt_results[0]
        comparison_fields = (
            "returncode",
            "period_ns",
            "worst_slack_ns",
            "total_negative_slack_ns",
            "derived_data_delay_ns",
            "stdout_sha256",
            "stderr_sha256",
        )
        first_signature = {
            field: first[field] for field in comparison_fields
        }
        if any(
            {field: result[field] for field in comparison_fields}
            != first_signature
            for result in attempt_results[1:]
        ):
            raise ProbeError(
                f"OpenSTA report content is not byte-identical for {run_dir.name}"
            )
        normalized.append(
            {
                **metadata,
                "timing": first_signature,
                "attempt_artifacts": [
                    {
                        "stdout": result["stdout"],
                        "stderr": result["stderr"],
                    }
                    for result in attempt_results
                ],
                "attempts": attempts,
                "repeatability_passed": True,
            }
        )
'''
          if text.count(old) != 1:
              raise SystemExit('repeatability block not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m pip install 'ruff==0.16.3'
          ruff format scripts/opensta_sdc_probe.py
          ruff check scripts/opensta_sdc_probe.py
          ruff format --check scripts/opensta_sdc_probe.py
      - name: Commit only the harness fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/opensta_sdc_probe.py
          git commit -m 'Compare OpenSTA report contents across attempts'
          git push origin HEAD:research/opensta-sdc-probe
