name: Repository hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tracked-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject generated and PDK artifacts
        run: python scripts/check_repo_hygiene.py
      - name: Require a clean checkout
        run: test -z "$(git status --porcelain)"
