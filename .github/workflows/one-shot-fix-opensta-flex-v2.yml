name: One-shot OpenSTA Flex include fix v2

on:
  push:
    branches:
      - research/opensta-sdc-probe

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/opensta-sdc-probe
      - name: Patch the exact CMake argument list
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/opensta-sdc-probe.yml')
          text = path.read_text(encoding='utf-8')
          slash = chr(92)
          flex_argument = '            -DFLEX_INCLUDE_DIR=/usr/include ' + slash + '\n'
          if flex_argument not in text:
              cudd_argument = (
                  '            -DCUDD_DIR="$root/cudd-3.0.0" ' + slash + '\n'
              )
              if text.count(cudd_argument) != 1:
                  raise SystemExit('unique CUDD CMake argument not found')
              text = text.replace(
                  cudd_argument,
                  cudd_argument + flex_argument,
                  1,
              )

          flex_check = '          test -f /usr/include/FlexLexer.h\n'
          if flex_check not in text:
              cmake_line = '          cmake ' + slash + '\n'
              if text.count(cmake_line) != 1:
                  raise SystemExit('unique CMake invocation not found')
              preamble = (
                  flex_check
                  + '          sha256sum /usr/include/FlexLexer.h '
                  + slash
                  + '\n'
                  + '            | tee "$root/flex-header.sha256.txt"\n\n'
              )
              text = text.replace(cmake_line, preamble + cmake_line, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/opensta-sdc-probe.yml
          if git diff --cached --quiet; then
            echo 'The OpenSTA workflow was already patched.'
            exit 0
          fi
          git commit -m 'Pin the OpenSTA Flex include directory'
          git push origin HEAD:research/opensta-sdc-probe
