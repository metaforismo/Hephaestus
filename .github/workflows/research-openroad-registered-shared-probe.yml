name: Research OpenROAD registered shared-DAG probe

on:
  push:
    branches:
      - research/openroad-registered-shared-probe
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openroad-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Hephaestus and pinned RTL proof tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            'iverilog=12.0-2build2' \
            'yosys=0.33-5build2' \
            'yosys-abc=0.33-5build2'
          python -m pip install -e '.[dev]'

      - name: Rebuild the formally bound registered source bundle
        run: |
          set -euo pipefail
          root=build/openroad-probe
          python -m hephaestus compile examples/tiny_weights.json \
            --out "$root/source" \
            --module hephaestus_openroad_probe_source \
            --verify-samples 256
          python -m hephaestus.baselines "$root/source" \
            --out "$root/matched" \
            --module hephaestus_openroad_probe \
            --verify-vectors 256 \
            --seed 71 \
            --simulate
          python -m hephaestus.formal "$root/matched" \
            --codes "$root/source/codes.npy" \
            --out "$root/formal" \
            --max-input-bits 64 \
            --timeout 300
          python -m hephaestus.registered "$root/matched" \
            --codes "$root/source/codes.npy" \
            --formal-evidence "$root/formal/formal_evidence.json" \
            --out "$root/registered" \
            --module hephaestus_openroad_probe_tile \
            --verify-vectors 256 \
            --seed 71 \
            --simulate

      - name: Stage one exact registered backend and common constraints
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/openroad-probe"
          design="$root/design"
          mkdir -p "$design"
          cp "$root/registered/shared_dag_core.sv" "$design/"
          cp "$root/registered/shared_dag_registered.sv" "$design/"
          cp "$root/registered/registered_manifest.json" "$design/source_registered_manifest.json"

          cat > "$design/constraints.sdc" <<'EOF'
          create_clock -name core_clock -period 4.000 [get_ports clk]
          set_clock_uncertainty 0.050 [get_clocks core_clock]
          set_clock_transition 0.050 [get_clocks core_clock]
          set non_clock_inputs [remove_from_collection [all_inputs] [get_ports clk]]
          set_input_delay 0.000 -clock core_clock $non_clock_inputs
          set_output_delay 0.000 -clock core_clock [all_outputs]
          set_driving_cell -lib_cell sg13g2_buf_4 $non_clock_inputs
          set_load 0.010 [all_outputs]
          EOF

          cat > "$design/config.mk" <<'EOF'
          HEPHAESTUS_DESIGN_DIR := $(dir $(abspath $(lastword $(MAKEFILE_LIST))))

          export PLATFORM = ihp-sg13g2
          export DESIGN_NAME = hephaestus_openroad_probe_tile_shared_dag_registered
          export DESIGN_NICKNAME = hephaestus_registered_shared_probe

          export VERILOG_FILES = \
            $(HEPHAESTUS_DESIGN_DIR)/shared_dag_core.sv \
            $(HEPHAESTUS_DESIGN_DIR)/shared_dag_registered.sv
          export SDC_FILE = $(HEPHAESTUS_DESIGN_DIR)/constraints.sdc

          export DIE_AREA = 0 0 250 250
          export CORE_AREA = 20 20 230 230
          export PLACE_DENSITY = 0.35
          export MIN_ROUTING_LAYER = Metal2
          export MAX_ROUTING_LAYER = Metal5
          EOF

      - name: Pull and capture the ORFS research container
        run: |
          set -euo pipefail
          root=build/openroad-probe
          image=openroad/orfs:latest
          docker pull "$image" | tee "$root/docker-pull.log"
          docker image inspect "$image" > "$root/docker-image-inspect.json"
          docker image inspect "$image" \
            --format '{{json .RepoDigests}}' > "$root/docker-repo-digests.json"
          docker run --rm "$image" bash -lc '
            set -e
            source /OpenROAD-flow-scripts/env.sh
            {
              echo "orfs_git_head=$(git -C /OpenROAD-flow-scripts rev-parse HEAD 2>/dev/null || echo unavailable)"
              echo "openroad=$(openroad -version 2>&1 | head -n 1)"
              echo "yosys=$(yosys -V 2>&1 | head -n 1)"
              echo "klayout=$(klayout -v 2>&1 | head -n 1 || true)"
              test -d /OpenROAD-flow-scripts/flow/platforms/ihp-sg13g2
            }
          ' | tee "$root/container-toolchain.txt"

      - name: Run the full registered shared-DAG ORFS flow
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/build/openroad-probe"
          image=openroad/orfs:latest
          mkdir -p "$root/orfs-work"
          docker run --rm \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/work" \
            "$image" bash -lc '
              set -euo pipefail
              source /OpenROAD-flow-scripts/env.sh
              flow=/OpenROAD-flow-scripts/flow
              config=/work/build/openroad-probe/design/config.mk
              work=/work/build/openroad-probe/orfs-work
              make -C "$flow" \
                DESIGN_CONFIG="$config" \
                FLOW_VARIANT=base \
                WORK_HOME="$work" \
                clean_all
              make -C "$flow" \
                DESIGN_CONFIG="$config" \
                FLOW_VARIANT=base \
                WORK_HOME="$work" \
                finish
              make -C "$flow" \
                DESIGN_CONFIG="$config" \
                FLOW_VARIANT=base \
                WORK_HOME="$work" \
                metadata-generate || true
            ' 2>&1 | tee "$root/orfs-console.log"

      - name: Validate and bind the physical probe outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path('build/openroad-probe').resolve()
          work = root / 'orfs-work'
          result = (
              work
              / 'results'
              / 'ihp-sg13g2'
              / 'hephaestus_registered_shared_probe'
              / 'base'
          )
          reports = (
              work
              / 'reports'
              / 'ihp-sg13g2'
              / 'hephaestus_registered_shared_probe'
              / 'base'
          )
          logs = (
              work
              / 'logs'
              / 'ihp-sg13g2'
              / 'hephaestus_registered_shared_probe'
              / 'base'
          )

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          required = {
              'final_gds': result / '6_final.gds',
              'final_def': result / '6_final.def',
              'final_verilog': result / '6_final.v',
              'final_open_db': result / '6_final.odb',
              'final_spef': result / '6_final.spef',
          }
          for label, path in required.items():
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'missing or empty ORFS output {label}: {path}')

          source_manifest = root / 'registered' / 'registered_manifest.json'
          if not source_manifest.is_file():
              raise SystemExit('registered source manifest is missing')
          source = json.loads(source_manifest.read_text(encoding='utf-8'))
          shared = source['backends']['shared_dag']
          if shared['wrapper_module'] != (
              'hephaestus_openroad_probe_tile_shared_dag_registered'
          ):
              raise SystemExit('registered wrapper identity drifted')
          if source['contract']['runtime_coefficient_reads_per_matvec'] != 0:
              raise SystemExit('source contract is not zero-fetch')

          metadata = reports / 'metadata.json'
          manifest = {
              'schema': 'hephaestus.openroad-registered-shared-probe.v1',
              'evidence_level': 'research_openroad_registered_shared_dag_probe',
              'source': {
                  'registered_manifest': source_manifest.relative_to(root).as_posix(),
                  'registered_manifest_sha256': sha256(source_manifest),
                  'backend': 'shared_dag',
                  'core_module': shared['core_module'],
                  'wrapper_module': shared['wrapper_module'],
                  'core_sha256': shared['core_sha256'],
                  'wrapper_sha256': shared['wrapper_sha256'],
              },
              'contract': {
                  'platform': 'ihp-sg13g2',
                  'clock_period_ns': 4.0,
                  'clock_uncertainty_ns': 0.05,
                  'input_delay_ns': 0.0,
                  'output_delay_ns': 0.0,
                  'input_driver_cell': 'sg13g2_buf_4',
                  'output_load_pf': 0.01,
                  'die_area_um': [0.0, 0.0, 250.0, 250.0],
                  'core_area_um': [20.0, 20.0, 230.0, 230.0],
                  'place_density': 0.35,
                  'minimum_routing_layer': 'Metal2',
                  'maximum_routing_layer': 'Metal5',
              },
              'toolchain': {
                  'docker_repo_digests': json.loads(
                      (root / 'docker-repo-digests.json').read_text(encoding='utf-8')
                  ),
                  'docker_image_inspect_sha256': sha256(
                      root / 'docker-image-inspect.json'
                  ),
                  'captured_versions': (
                      root / 'container-toolchain.txt'
                  ).read_text(encoding='utf-8').splitlines(),
              },
              'artifacts': {
                  label: {
                      'path': path.relative_to(root).as_posix(),
                      'size_bytes': path.stat().st_size,
                      'sha256': sha256(path),
                  }
                  for label, path in required.items()
              },
              'reports': {
                  'directory': reports.relative_to(root).as_posix(),
                  'metadata_present': metadata.is_file(),
                  'metadata_sha256': sha256(metadata) if metadata.is_file() else None,
              },
              'logs': {
                  'directory': logs.relative_to(root).as_posix(),
                  'console_sha256': sha256(root / 'orfs-console.log'),
              },
              'claims': {
                  'registered_source_bound_by_digest': True,
                  'openroad_flow_completed': True,
                  'placement_performed': True,
                  'routing_performed': True,
                  'routed_gds_generated': True,
                  'routed_def_generated': True,
                  'routed_open_db_generated': True,
                  'spef_generated': True,
                  'matched_three_backend_physical_comparison_performed': False,
                  'post_physical_equivalence_verified': False,
                  'independent_drc_verified': False,
                  'lvs_clean': False,
                  'activity_based_power_estimated': False,
                  'post_layout_pex_verified': False,
                  'foundry_signoff_complete': False,
                  'silicon_verified': False,
              },
          }
          (root / 'openroad_probe_manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(manifest['artifacts'], indent=2, sort_keys=True))
          PY

      - name: Upload the complete research probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hephaestus-openroad-registered-shared-probe
          path: build/openroad-probe
          if-no-files-found: error
          retention-days: 14
