name: Evidence cleanup

on:
  push:
    branches:
      - feat/evidence-benchmarks

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary formatting workflows
        run: |
          sleep 20
          git pull --rebase origin feat/evidence-benchmarks
          rm -f .github/workflows/evidence-format.yml
          rm -f .github/workflows/evidence-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary evidence automation"
          git push
