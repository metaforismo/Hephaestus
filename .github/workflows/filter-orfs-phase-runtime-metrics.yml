name: One-shot filter ORFS phase runtime metrics

on:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.head_ref == 'feat/openroad-physical-evidence' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/openroad-physical-evidence
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Correct stable ORFS metric selection
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/hephaestus/openroad_physical.py')
          text = source.read_text(encoding='utf-8')
          needle = '        tokens = set(_METRIC_TOKEN_RE.findall(prefix.lower()))'
          replacement = '\n'.join(
              [
                  '        lowered_prefix = prefix.lower()',
                  '        # ORFS FastRoute writes internal wall-clock phase durations with a',
                  '        # trailing `_s`. They are execution provenance, not physical QoR.',
                  '        if lowered_prefix.endswith("_s"):',
                  '            return',
                  '        tokens = set(_METRIC_TOKEN_RE.findall(lowered_prefix))',
              ]
          )
          if text.count(needle) != 1:
              raise SystemExit(
                  f'expected one stable-metric selector line, found {text.count(needle)}'
              )
          source.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          tests = Path('tests/test_openroad_physical.py')
          text = tests.read_text(encoding='utf-8')
          needle = '            "run__runtime__seconds": 91.0,'
          inserted = (
              needle
              + '\n'
              + '            "globalroute__global_route__fastroute__route_l_s": 0.0006,'
          )
          if text.count(needle) != 1:
              raise SystemExit(
                  f'expected one metadata-noise fixture line, found {text.count(needle)}'
              )
          tests.write_text(text.replace(needle, inserted, 1), encoding='utf-8')

          docs = Path('docs/OPENROAD_PHYSICAL_EVIDENCE.md')
          text = docs.read_text(encoding='utf-8')
          marker = (
              'quality-of-result fields are retained separately from runtime, host, timestamp, '
              'and version noise.\n'
          )
          addition = (
              marker
              + 'FastRoute phase-duration fields ending in `_s` are classified as execution '
              + 'provenance, not\nphysical QoR.\n'
          )
          if text.count(marker) != 1:
              raise SystemExit(
                  f'expected one metadata documentation sentence, found {text.count(marker)}'
              )
          docs.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY

      - name: Format and verify the correction
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          ruff format \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py
          ruff check \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py
          ruff format --check \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py
          pytest tests/test_openroad_physical.py

      - name: Commit the permanent correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/filter-orfs-phase-runtime-metrics.yml
          git add \
            src/hephaestus/openroad_physical.py \
            tests/test_openroad_physical.py \
            docs/OPENROAD_PHYSICAL_EVIDENCE.md
          git commit -m 'Exclude ORFS phase runtimes from repeatability'
          git push origin HEAD:feat/openroad-physical-evidence
